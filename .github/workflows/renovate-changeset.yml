# =============================================================================
# Renovate changeset — closes the "merged but never released" hole.
#
# In changeset-released repos, a Renovate dependency bump merges without a
# changeset, so no Version Packages PR is minted and the fix never ships
# (found the hard way with CVE-2026-75604: two apps merged the next patch and
# stranded it on main). This reusable workflow runs from a caller's
# `pull_request: [closed]` trigger: when a merged Renovate PR touched the
# lockfile and carried no changeset, it opens a changeset PR via the GitOps
# App (App-token PRs trigger CI; GITHUB_TOKEN ones do not).
#
# Deliberately fail-safe: ANY lockfile-touching Renovate merge gets a
# changeset, including devDependency-only bumps. A false positive costs one
# harmless patch release; a false negative strands a security fix — the
# asymmetry that motivated this workflow.
#
# Caller contract:
#   on:
#     pull_request:
#       types: [closed]
#       branches: [main]
#   jobs:
#     changeset:
#       if: github.event.pull_request.merged == true &&
#           github.event.pull_request.user.login == 'renovate[bot]'
#       uses: Corey-Alan-Consulting/deploy-workflows/.github/workflows/renovate-changeset.yml@<sha> # vX.Y.Z
#       with:
#         changeset-frontmatter: "'my-package': patch"
#       secrets:
#         app-id: ${{ secrets.GITOPS_APP_ID }}
#         app-private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
# =============================================================================

name: Renovate changeset

on:
  workflow_call:
    inputs:
      changeset-frontmatter:
        description: >-
          Package bump lines for the changeset frontmatter, e.g.
          "'blue-skysolutions': patch" (multi-line for several packages).
        required: true
        type: string
      base-branch:
        description: 'Branch releases are cut from'
        required: false
        type: string
        default: main
    secrets:
      app-id:
        required: true
      app-private-key:
        required: true

permissions: {}

jobs:
  changeset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: renovate-changeset-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          # Least privilege: push the changeset branch + open the PR.
          permission-contents: write
          permission-pull-requests: write

      # token: the App token, NOT the default GITHUB_TOKEN. This job declares
      # no permissions, so GITHUB_TOKEN carries no scopes at all and cloning a
      # private repo with it fails `remote: Repository not found` — a 404, not
      # a 403, because GitHub will not confirm a repo you cannot read. That is
      # exactly how this workflow failed silently from the day it shipped: 15
      # merged Renovate PRs across three repos, 15 failures, zero successes,
      # and the "merged but never released" hole it exists to close stayed
      # open the whole time. Found 2026-10-12 by watching the first automerged
      # dependency PR actually land.
      #
      # persist-credentials stays false deliberately: the script below pushes
      # with its own authenticated remote, so the token must not linger in
      # .git/config afterwards.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base-branch }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Open a changeset PR if the merge released nothing
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Untrusted (Renovate-authored) values stay in env vars — never
          # interpolated into the script text.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          FRONTMATTER: ${{ inputs.changeset-frontmatter }}
          BASE: ${{ inputs.base-branch }}
        run: |
          set -euo pipefail

          files=$(git diff --name-only "${MERGE_SHA}^" "${MERGE_SHA}")

          if grep -q '^\.changeset/.*\.md$' <<<"$files"; then
            echo "Merged PR already carried a changeset — nothing to do."
            exit 0
          fi
          if ! grep -qE '(^|/)pnpm-lock\.yaml$' <<<"$files"; then
            echo "No lockfile change — nothing shipped changed; no release needed."
            exit 0
          fi

          branch="chore/changeset-renovate-pr${PR_NUMBER}"
          # Authenticated URL for the existence probe below: checkout does not
          # persist credentials, so plain `origin` has no auth on a private repo.
          # Nothing is pushed through it — the commit goes via the API.
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code "$remote" "refs/heads/${branch}" >/dev/null 2>&1; then
            echo "Changeset branch already exists — skipping (idempotent rerun)."
            exit 0
          fi

          file=".changeset/renovate-pr${PR_NUMBER}.md"
          body=$(
            echo '---'
            printf '%s\n' "$FRONTMATTER"
            echo '---'
            echo
            printf 'Dependency update: %s (#%s).\n' "$PR_TITLE" "$PR_NUMBER"
          )

          # From the API, not `git rev-parse origin/<base>`: checkout pinned a ref,
          # so a remote-tracking branch is not guaranteed to exist.
          base_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BASE}" --jq .object.sha)
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/heads/${branch}" -f "sha=${base_sha}" >/dev/null

          # The commit is created through the API, NOT `git commit` + push.
          #
          # A local git commit in CI is UNSIGNED and authored by
          # github-actions[bot]. Repos here enforce required_signatures
          # (jlshaw.link, dispatchr.social, blue-skysolutions.com,
          # capturly.app, deploy-workflows) and set
          # require_extra_approval_for_unattributed_changes, so those PRs were
          # created successfully and then sat unmergeable — ten of them at
          # once on 2026-10-12. createCommitOnBranch has GitHub sign the
          # commit and attribute it to the App, which satisfies both.
          #
          # Untrusted values reach the payload only through jq --arg, never
          # through string interpolation into the query.
          payload=$(jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "refs/heads/${branch}" \
            --arg oid "$base_sha" \
            --arg path "$file" \
            --arg contents "$(printf '%s' "$body" | base64 | tr -d '\n')" \
            --arg headline "chore: changeset for Renovate PR #${PR_NUMBER}" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $oid,
                message: {headline: $headline},
                fileChanges: {additions: [{path: $path, contents: $contents}]}
              }}
            }')
          printf '%s' "$payload" | gh api graphql --input - >/dev/null

          gh pr create \
            --base "$BASE" \
            --head "$branch" \
            --title "chore: changeset for Renovate PR #${PR_NUMBER}" \
            --body "Renovate merged a lockfile-changing dependency update without a changeset, so nothing would release. This patch changeset mints the release. Source: #${PR_NUMBER} (\"${PR_TITLE}\")."
