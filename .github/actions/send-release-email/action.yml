name: Send release email (DEPRECATED)
description: >-
  DEPRECATED — do not adopt. This fired at tag-publish (before the release
  was verified live) and rendered the root package's always-empty changelog.
  Replaced by the release-announcement pipeline: the reusable
  release-announce.yml / release-announce-send.yml workflows plus the
  build-release-announcement action, which verify the deploy, aggregate
  per-package changelogs, and send through the coreyalan platform after Port
  approval. This action is kept only so pinned historical callers keep
  resolving; it will be deleted once no repo references it.

inputs:
  to:
    description: >-
      Recipient (the release owner's notification address). Optional — when
      empty (e.g. RELEASE_NOTIFY_EMAIL isn't set), the email is sent to
      company_email instead so it still goes out.
    required: false
    default: ""
  company_email:
    description: >-
      Company/security address always CC'd for a central release audit trail.
      Set to a real mailbox or list; pass "" to disable.
    required: false
    default: security@coreyalan.com
  mailgun_api_key:
    description: Mailgun private API key.
    required: true
  mailgun_domain:
    description: Mailgun sending domain (e.g. coreyalan.com).
    required: true
  from:
    description: From header. Defaults to "Corey Alan Consulting <noreply@<domain>>".
    required: false
    default: ""
  github_token:
    description: Token used to render the release notes markdown to HTML.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Render and send release email
      shell: bash
      env:
        TO: ${{ inputs.to }}
        COMPANY: ${{ inputs.company_email }}
        MG_KEY: ${{ inputs.mailgun_api_key }}
        MG_DOMAIN: ${{ inputs.mailgun_domain }}
        FROM_IN: ${{ inputs.from }}
        GH_TOKEN: ${{ inputs.github_token }}
        # Release context (passed via env, never interpolated into the script).
        REPO: ${{ github.event.repository.name }}
        VERSION: ${{ github.event.release.tag_name }}
        URL: ${{ github.event.release.html_url }}
        NOTES: ${{ github.event.release.body }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        : "${MG_KEY:?mailgun_api_key is required}"
        : "${MG_DOMAIN:?mailgun_domain is required}"
        # No per-repo recipient set → send to the company address instead (and
        # don't also CC it). If neither is set, there's nowhere to send.
        if [ -z "${TO:-}" ]; then
          TO="${COMPANY:-}"
          COMPANY=""
        fi
        : "${TO:?no recipient: set 'to' (e.g. RELEASE_NOTIFY_EMAIL) or company_email}"
        FROM="${FROM_IN:-Corey Alan Consulting <noreply@${MG_DOMAIN}>}"

        # Render the release notes (GitHub-flavored markdown) to HTML via the
        # GitHub API; fall back to the raw text wrapped in a <pre> on any failure.
        NOTES_HTML="$(curl -sS --fail \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/markdown \
          -d "$(jq -nc --arg t "${NOTES:-}" '{text:$t,mode:"gfm"}')" 2>/dev/null || true)"
        if [ -z "$NOTES_HTML" ]; then
          NOTES_HTML="<pre style=\"white-space:pre-wrap;font-family:inherit;\">$(jq -rn --arg t "${NOTES:-}" '$t' | sed 's/&/\&amp;/g;s/</\&lt;/g;s/>/\&gt;/g')</pre>"
        fi

        export REPO VERSION URL NOTES_HTML
        export YEAR="$(date -u +%Y)"
        export SUMMARY="${VERSION} is available"
        python3 "${ACTION_PATH}/render.py" "${ACTION_PATH}/release.html" > rendered.html

        # CC the company/security address (release audit trail) unless it's blank
        # or already the To.
        cc_args=()
        if [ -n "${COMPANY:-}" ] && [ "${COMPANY}" != "${TO}" ]; then
          cc_args+=(-F "cc=${COMPANY}")
        fi

        curl -sS --fail --user "api:${MG_KEY}" \
          "https://api.mailgun.net/v3/${MG_DOMAIN}/messages" \
          -F from="${FROM}" \
          -F to="${TO}" \
          ${cc_args[@]+"${cc_args[@]}"} \
          -F subject="🚀 ${REPO} ${VERSION} released" \
          -F text="${REPO} ${VERSION} is live: ${URL}" \
          -F html='<rendered.html'
        echo "Sent release email for ${REPO} ${VERSION} to ${TO}${COMPANY:+ (cc ${COMPANY})}"
