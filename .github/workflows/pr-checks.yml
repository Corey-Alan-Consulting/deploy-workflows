name: PR Checks

# Lint and security-audit the reusable workflows themselves: they build, sign,
# and push every app's image and callers reference them at @main, so a broken or
# unsafe change must be caught before it reaches main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Workflow schema/expression validation + shellcheck on every run: body.
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GitHub Actions security audit: template injection, over-broad
      # permissions, unpinned actions, credential persistence. Advisory for now —
      # the existing workflows carry a template-injection / artipacked backlog
      # (visible in the Security tab) to be refactored to env-passing. Once that
      # is cleared, drop continue-on-error and add `zizmor` to required checks.
      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        continue-on-error: true

  announcement-scripts:
    name: release-announcement scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Dependency-free node:test suite for the build-release-announcement
      # composite action (runner-preinstalled Node is sufficient).
      - run: node --test .github/actions/build-release-announcement/announcement.test.mjs
      # Send-side renderer, upstreamed from capturly so every repo gets a
      # non-empty GitHub Release body rather than just that one.
      - run: node --test .github/actions/backfill-release-body/backfill.test.mjs
