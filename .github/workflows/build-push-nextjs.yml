name: Build and Push Next.js App

on:
  workflow_call:
    inputs:
      app_name:
        description: "Application name (used for tagging and identification)"
        required: true
        type: string
      gcp_project_id:
        description: "GCP project ID where Artifact Registry lives"
        required: true
        type: string
      gcp_project_number:
        description: "GCP project number (for WIF provider path)"
        required: true
        type: string
      ar_repository:
        description: "Artifact Registry repo/image path (e.g. 'coreyalan/coreyalan-web')"
        required: true
        type: string
      node_version:
        description: "Node.js version"
        required: false
        type: string
        default: "20"
      package_manager:
        description: "Package manager: pnpm, npm, or yarn"
        required: false
        type: string
        default: "pnpm"
      pnpm_version:
        description: "pnpm version (only used when package_manager is pnpm; leave empty to read from package.json)"
        required: false
        type: string
        default: ""
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "Dockerfile.prebuilt"
      build_context:
        description: "Docker build context path"
        required: false
        type: string
        default: "."
      build_mode:
        description: "Build mode: 'prebuilt' (build on runner, Docker copies artifacts) or 'dockerfile' (self-contained multi-stage Docker build)"
        required: false
        type: string
        default: "prebuilt"
      build_output_paths:
        description: "Newline-separated paths to upload as build artifacts (prebuilt mode only)"
        required: false
        type: string
        default: |
          .next/standalone/
          .next/static/
          public/
          prisma/
      preserve_artifact_paths:
        description: "Preserve full directory structure in build artifacts (prevents common prefix stripping by upload-artifact)"
        required: false
        type: boolean
        default: false
      pre_build_commands:
        description: "Commands to run before build (e.g. 'npx prisma generate')"
        required: false
        type: string
        default: ""
      build_command:
        description: "Override build command (empty = auto from package_manager)"
        required: false
        type: string
        default: ""
      install_command:
        description: "Override install command (empty = auto from package_manager, 'skip' to skip)"
        required: false
        type: string
        default: ""
      lint_command:
        description: "Override lint command (empty = auto from package_manager, 'skip' to skip)"
        required: false
        type: string
        default: ""
      test_command:
        description: "Override test command (empty = auto from package_manager, 'skip' to skip)"
        required: false
        type: string
        default: ""
      enable_lint:
        description: "Run linting in the Test & Quality job"
        required: false
        type: boolean
        default: true
      enable_test:
        description: "Run tests in the Test & Quality job"
        required: false
        type: boolean
        default: true
      enable_security_scan:
        description: "Run Trivy security scanning"
        required: false
        type: boolean
        default: true
      enable_image_cleanup:
        description: "Clean old images from Artifact Registry"
        required: false
        type: boolean
        default: true
      images_to_keep:
        description: "Number of recent images to keep during cleanup"
        required: false
        type: number
        default: 10
      registry:
        description: "Artifact Registry hostname"
        required: false
        type: string
        default: "us-central1-docker.pkg.dev"
      # Override WIF defaults if project uses non-standard naming
      wif_provider_override:
        description: "Full WIF provider path (overrides convention)"
        required: false
        type: string
        default: ""
      wif_sa_override:
        description: "GCP service account email (overrides convention)"
        required: false
        type: string
        default: ""
      # Migration image (optional - for apps with database migrations)
      build_migration_image:
        description: "Build a lightweight migration image alongside the app image"
        required: false
        type: boolean
        default: false
      migration_dockerfile:
        description: "Path to migration Dockerfile"
        required: false
        type: string
        default: "Dockerfile.migrate"
      migration_ar_repository:
        description: "AR repo/image path for migration image (e.g. 'dispatchr-social/dispatchr-web-migrate')"
        required: false
        type: string
        default: ""
    outputs:
      digest:
        description: "App image digest (sha256:...)"
        value: ${{ jobs.docker.outputs.digest }}
      image:
        description: "Full app image reference (without digest)"
        value: ${{ jobs.docker.outputs.image }}
      migrate_digest:
        description: "Migration image digest (sha256:...), empty if not built"
        value: ${{ jobs.migration.outputs.digest }}
    secrets:
      bws_access_token:
        description: "Bitwarden Secrets Manager access token (for build-time secrets)"
        required: false
      build_secrets:
        description: "Bitwarden secret mappings for build-time env vars (bitwarden/sm-action format)"
        required: false
      npm_auth_token:
        description: |
          Auth token for the npmjs.org registry, used to install private
          scoped packages (e.g. @corey-alan-consulting/v1-sdk). Should be
          an npmjs.com automation token or granular access token with read
          access to the relevant org/scope. Stored as an org-level Actions
          secret so consumer repos inherit it automatically.
        required: false

# Cancel in-progress workflows when a new commit is pushed
concurrency:
  group: deploy-${{ inputs.app_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Derive WIF values from convention unless overridden
  WIF_PROVIDER: ${{ inputs.wif_provider_override != '' && inputs.wif_provider_override || format('projects/{0}/locations/global/workloadIdentityPools/github-pool/providers/github-provider', inputs.gcp_project_number) }}
  WIF_SA: ${{ inputs.wif_sa_override != '' && inputs.wif_sa_override || format('github-actions@{0}.iam.gserviceaccount.com', inputs.gcp_project_id) }}
  IMAGE: ${{ inputs.registry }}/${{ inputs.gcp_project_id }}/${{ inputs.ar_repository }}
  MIGRATE_IMAGE: ${{ inputs.migration_ar_repository != '' && format('{0}/{1}/{2}', inputs.registry, inputs.gcp_project_id, inputs.migration_ar_repository) || '' }}

jobs:
  # ===========================================================================
  # Test & Lint
  # ===========================================================================
  test:
    name: Test & Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      (inputs.enable_test || inputs.enable_lint) &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve package manager commands
        id: pm
        env:
          PM: ${{ inputs.package_manager }}
          INPUT_INSTALL: ${{ inputs.install_command }}
          INPUT_LINT: ${{ inputs.lint_command }}
          INPUT_TEST: ${{ inputs.test_command }}
        run: |
          # Install command
          if [ "$INPUT_INSTALL" = "skip" ]; then
            echo "install_cmd=skip" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_INSTALL" ]; then
            echo "install_cmd=$INPUT_INSTALL" >> "$GITHUB_OUTPUT"
          else
            case "$PM" in
              npm)  echo "install_cmd=npm ci" >> "$GITHUB_OUTPUT" ;;
              yarn) echo "install_cmd=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT" ;;
              *)    echo "install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
          # Lint command
          if [ "$INPUT_LINT" = "skip" ]; then
            echo "lint_cmd=skip" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_LINT" ]; then
            echo "lint_cmd=$INPUT_LINT" >> "$GITHUB_OUTPUT"
          else
            case "$PM" in
              npm)  echo "lint_cmd=npm run lint" >> "$GITHUB_OUTPUT" ;;
              yarn) echo "lint_cmd=yarn lint" >> "$GITHUB_OUTPUT" ;;
              *)    echo "lint_cmd=pnpm lint" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
          # Test command
          if [ "$INPUT_TEST" = "skip" ]; then
            echo "test_cmd=skip" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_TEST" ]; then
            echo "test_cmd=$INPUT_TEST" >> "$GITHUB_OUTPUT"
          else
            case "$PM" in
              # npm requires `--` to forward args to the underlying script.
              # NOTE: if the script invokes jest, jest will read everything
              # after `--` as a positional test path pattern, so
              # `--passWithNoTests` becomes a pattern matching zero files
              # and jest exits 1. npm + jest consumers must override
              # `test_command` (e.g. `npm run test:ci` with the flag baked
              # into the script body).
              npm)  echo "test_cmd=npm test -- --passWithNoTests" >> "$GITHUB_OUTPUT" ;;
              # yarn forwards args directly without injecting `--`, so the
              # flag reaches jest as a flag, not as a path pattern.
              yarn) echo "test_cmd=yarn test --passWithNoTests" >> "$GITHUB_OUTPUT" ;;
              # pnpm 10+ forwards unknown flags after the script name
              # directly to the script (no `--` injected). Empirically
              # verified with pnpm 10.34.1: `pnpm test --foo` produces
              # `<script-body> --foo`, not `<script-body> -- --foo`. Earlier
              # versions of pnpm (≤9) DID intercept unknown flags as pnpm
              # options — consumers still on pnpm ≤9 must override
              # `test_command`. Using `--` here would cause jest to read
              # `--passWithNoTests` as a test path pattern (matches zero
              # files → exits 1), so we deliberately omit it.
              *)    echo "test_cmd=pnpm test --passWithNoTests" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - uses: pnpm/action-setup@v4
        if: inputs.package_manager == 'pnpm'
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager }}

      - name: Install dependencies
        if: steps.pm.outputs.install_cmd != 'skip'
        env:
          INSTALL_CMD: ${{ steps.pm.outputs.install_cmd }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          # Optional PAT for GitHub Packages npm registry. Empty when not
          # supplied — install proceeds without partner-package auth, which
          # is fine unless the lockfile pulls a scoped private dep.
          TOKEN: ${{ secrets.npm_auth_token }}
        run: |
          if [ -n "${TOKEN}" ]; then
            echo "::add-mask::${TOKEN}"
            echo "GH Packages token present (${#TOKEN} chars), writing auth lines"
            # Write to both project .npmrc (highest pnpm precedence) and
            # ~/.npmrc (fallback). Package-manager-agnostic; the token never
            # lands on disk in the checked-out tree (CI scratch only).
            echo "//registry.npmjs.org/:_authToken=${TOKEN}" >> .npmrc
            echo "//registry.npmjs.org/:_authToken=${TOKEN}" >> "${HOME}/.npmrc"
          else
            echo "No GH App credentials supplied — install will lack GH Packages auth"
          fi
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts..."
            if eval "$INSTALL_CMD"; then
              exit 0
            fi
            [ $attempt -lt $max_attempts ] && sleep 10
            attempt=$((attempt + 1))
          done
          exit 1

      - name: Pre-build commands
        if: inputs.pre_build_commands != ''
        run: ${{ inputs.pre_build_commands }}

      - name: Lint
        if: inputs.enable_lint && steps.pm.outputs.lint_cmd != 'skip'
        run: ${{ steps.pm.outputs.lint_cmd }}
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Test
        if: inputs.enable_test && steps.pm.outputs.test_cmd != 'skip'
        run: ${{ steps.pm.outputs.test_cmd }}
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  # ===========================================================================
  # Security Scan (filesystem)
  # ===========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.enable_security_scan && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/'))
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve package manager commands
        id: pm
        env:
          PM: ${{ inputs.package_manager }}
          INPUT_INSTALL: ${{ inputs.install_command }}
        run: |
          if [ "$INPUT_INSTALL" = "skip" ]; then
            echo "install_cmd=skip" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_INSTALL" ]; then
            echo "install_cmd=$INPUT_INSTALL" >> "$GITHUB_OUTPUT"
          else
            case "$PM" in
              npm)  echo "install_cmd=npm ci" >> "$GITHUB_OUTPUT" ;;
              yarn) echo "install_cmd=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT" ;;
              *)    echo "install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
          case "$PM" in
            npm)  echo "audit_cmd=npm audit --audit-level=moderate" >> "$GITHUB_OUTPUT" ;;
            yarn) echo "audit_cmd=yarn audit --level moderate" >> "$GITHUB_OUTPUT" ;;
            *)    echo "audit_cmd=pnpm audit --audit-level=moderate" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: pnpm/action-setup@v4
        if: inputs.package_manager == 'pnpm'
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager }}

      - name: Install dependencies
        if: steps.pm.outputs.install_cmd != 'skip'
        env:
          INSTALL_CMD: ${{ steps.pm.outputs.install_cmd }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          TOKEN: ${{ secrets.npm_auth_token }}
        run: |
          if [ -n "${TOKEN}" ]; then
            echo "::add-mask::${TOKEN}"
            echo "//registry.npmjs.org/:_authToken=${TOKEN}" >> .npmrc
            echo "//registry.npmjs.org/:_authToken=${TOKEN}" >> "${HOME}/.npmrc"
          fi
          eval "$INSTALL_CMD" || true

      - name: Security audit
        run: ${{ steps.pm.outputs.audit_cmd }}
        continue-on-error: true

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
        continue-on-error: true

      - name: Trivy SARIF report
        uses: aquasecurity/trivy-action@v0.35.0
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  # ===========================================================================
  # Build Application (prebuilt mode only)
  # ===========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, security]
    if: always() && needs.test.result != 'failure' && inputs.build_mode == 'prebuilt'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check for Bitwarden token
        id: bws-check
        run: |
          if [ -n "$BWS_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          BWS_TOKEN: ${{ secrets.bws_access_token }}

      - name: Get build-time secrets from Bitwarden
        if: steps.bws-check.outputs.has_token == 'true'
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.bws_access_token }}
          secrets: ${{ secrets.build_secrets }}

      - name: Resolve package manager commands
        id: pm
        env:
          PM: ${{ inputs.package_manager }}
          INPUT_INSTALL: ${{ inputs.install_command }}
          INPUT_BUILD: ${{ inputs.build_command }}
        run: |
          # Install command
          if [ "$INPUT_INSTALL" = "skip" ]; then
            echo "install_cmd=skip" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_INSTALL" ]; then
            echo "install_cmd=$INPUT_INSTALL" >> "$GITHUB_OUTPUT"
          else
            case "$PM" in
              npm)  echo "install_cmd=npm ci" >> "$GITHUB_OUTPUT" ;;
              yarn) echo "install_cmd=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT" ;;
              *)    echo "install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
          # Build command
          if [ -n "$INPUT_BUILD" ]; then
            echo "build_cmd=$INPUT_BUILD" >> "$GITHUB_OUTPUT"
          else
            case "$PM" in
              npm)  echo "build_cmd=npm run build" >> "$GITHUB_OUTPUT" ;;
              yarn) echo "build_cmd=yarn build" >> "$GITHUB_OUTPUT" ;;
              *)    echo "build_cmd=pnpm build" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - uses: pnpm/action-setup@v4
        if: inputs.package_manager == 'pnpm'
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager }}

      - name: Install dependencies
        if: steps.pm.outputs.install_cmd != 'skip'
        env:
          INSTALL_CMD: ${{ steps.pm.outputs.install_cmd }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          # Optional PAT for GitHub Packages npm registry. Empty when not
          # supplied — install proceeds without partner-package auth, which
          # is fine unless the lockfile pulls a scoped private dep.
          TOKEN: ${{ secrets.npm_auth_token }}
        run: |
          if [ -n "${TOKEN}" ]; then
            echo "::add-mask::${TOKEN}"
            echo "GH Packages token present (${#TOKEN} chars), writing auth lines"
            # Write to both project .npmrc (highest pnpm precedence) and
            # ~/.npmrc (fallback). Package-manager-agnostic; the token never
            # lands on disk in the checked-out tree (CI scratch only).
            echo "//registry.npmjs.org/:_authToken=${TOKEN}" >> .npmrc
            echo "//registry.npmjs.org/:_authToken=${TOKEN}" >> "${HOME}/.npmrc"
          else
            echo "No GH App credentials supplied — install will lack GH Packages auth"
          fi
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts..."
            if eval "$INSTALL_CMD"; then
              exit 0
            fi
            [ $attempt -lt $max_attempts ] && sleep 10
            attempt=$((attempt + 1))
          done
          exit 1

      - name: Pre-build commands
        if: inputs.pre_build_commands != ''
        run: ${{ inputs.pre_build_commands }}

      - name: Remove local .env files
        run: rm -f .env .env.local .env.production .env.production.local .env.development .env.development.local 2>/dev/null || true

      - name: Build
        run: ${{ steps.pm.outputs.build_cmd }}
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Stage build artifacts
        if: inputs.preserve_artifact_paths
        run: |
          mkdir -p staged-output
          while IFS= read -r path; do
            path="$(echo "$path" | xargs)"
            [ -z "$path" ] && continue
            path="${path%/}"
            if [ -e "$path" ]; then
              dest="staged-output/${path}"
              mkdir -p "$(dirname "$dest")"
              cp -r "$path" "$dest"
              echo "Staged: $path -> $dest"
            else
              echo "Warning: $path does not exist, skipping"
            fi
          done <<< "${{ inputs.build_output_paths }}"

      - uses: actions/upload-artifact@v4
        if: inputs.preserve_artifact_paths
        with:
          name: build-output
          path: staged-output/
          include-hidden-files: true
          retention-days: 1

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.preserve_artifact_paths }}
        with:
          name: build-output
          path: ${{ inputs.build_output_paths }}
          include-hidden-files: true
          retention-days: 1

  # ===========================================================================
  # Docker Build, Push & Sign
  # ===========================================================================
  docker:
    name: Docker
    runs-on: ubuntu-latest
    # `migration` is intentionally upstream of `docker` so its image is in
    # Artifact Registry before the app image's push notification fires.
    # The gitops-trigger Cloud Run service resolves the matching
    # `*-migrate` digest synchronously when the app push event arrives;
    # ordering it the other way leaves a sub-minute window where the HEAD
    # 404s and the migrate digest never makes it into values.yaml.
    needs: [build, migration]
    if: always() && needs.build.result != 'failure' && needs.migration.result != 'failure'
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ env.IMAGE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: inputs.build_mode == 'prebuilt'
        with:
          name: build-output
          path: build-output

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ inputs.registry }}

      - uses: docker/setup-buildx-action@v3

      - name: Determine tags
        id: tags
        env:
          SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAGS="${IMAGE}:${SHA}"
          TAGS="${TAGS},${IMAGE}:latest"

          # Add version tag if this is a tag push. Normalize the source-repo
          # tag to a clean v<semver> shape so the image tag is OCI-valid and
          # matches the platform-infra helm convention regardless of which
          # release tool ran upstream:
          #   - release-please: "v0.1.5"                  -> "v0.1.5"
          #   - Changesets:     "blue-skysolutions@0.1.6" -> "v0.1.6"
          # Only the '@'-shaped form is rewritten; legacy / component-
          # prefixed tags like "license-v2.0.0" are passed through unchanged
          # (callers gate those out at the deploy.yml trigger anyway).
          # OCI distribution disallows '@' in tags, so the raw Changesets
          # tag would fail the push outright if we didn't rewrite it.
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ "$REF_NAME" == *"@"* ]]; then
              VERSION="v${REF_NAME##*@}"
            else
              VERSION="$REF_NAME"
            fi
            TAGS="${TAGS},${IMAGE}:${VERSION}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign image with Cosign
        uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

  # ===========================================================================
  # Migration Image (optional - for apps with database migrations)
  # ===========================================================================
  migration:
    name: Migration Image
    runs-on: ubuntu-latest
    needs: build
    if: inputs.build_migration_image && inputs.migration_ar_repository != '' && needs.build.result != 'failure'
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ inputs.registry }}

      - uses: docker/setup-buildx-action@v3

      - name: Determine tags
        id: tags
        env:
          SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAGS="${MIGRATE_IMAGE}:${SHA}"
          TAGS="${TAGS},${MIGRATE_IMAGE}:latest"

          # Mirror the web-image normalization above so the migrate image
          # carries the same v<semver> tag the web image does.
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ "$REF_NAME" == *"@"* ]]; then
              VERSION="v${REF_NAME##*@}"
            else
              VERSION="$REF_NAME"
            fi
            TAGS="${TAGS},${MIGRATE_IMAGE}:${VERSION}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.migration_dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=migration
          cache-to: type=gha,mode=max,scope=migration

      - name: Sign migration image with Cosign
        uses: sigstore/cosign-installer@v3
      - env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${MIGRATE_IMAGE}@${DIGEST}"

  # ===========================================================================
  # Trivy Image Scan
  # ===========================================================================
  trivy-image-scan:
    name: Scan Image
    runs-on: ubuntu-latest
    needs: docker
    if: always() && needs.docker.result == 'success' && inputs.enable_security_scan
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ inputs.registry }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: "${{ needs.docker.outputs.image }}@${{ needs.docker.outputs.digest }}"
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
        continue-on-error: true

      - name: Trivy SARIF report
        uses: aquasecurity/trivy-action@v0.35.0
        if: always()
        with:
          image-ref: "${{ needs.docker.outputs.image }}@${{ needs.docker.outputs.digest }}"
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-image-results.sarif') != ''
        with:
          sarif_file: trivy-image-results.sarif
        continue-on-error: true

  # ===========================================================================
  # Cleanup Old Images
  # ===========================================================================
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: docker
    if: always() && needs.docker.result == 'success' && inputs.enable_image_cleanup
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Delete old images
        run: |
          IMAGE_PATH="${{ inputs.registry }}/${{ inputs.gcp_project_id }}/${{ inputs.ar_repository }}"
          KEEP=${{ inputs.images_to_keep }}

          echo "Listing images in ${IMAGE_PATH}..."
          DIGESTS=$(gcloud artifacts docker images list "${IMAGE_PATH}" \
            --sort-by="~UPDATE_TIME" \
            --format="value(version)" \
            --include-tags 2>/dev/null || true)

          if [ -z "$DIGESTS" ]; then
            echo "No images found or unable to list."
            exit 0
          fi

          COUNT=0
          while IFS= read -r digest; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -le $KEEP ]; then
              echo "Keeping: ${digest}"
            else
              echo "Deleting: ${digest}"
              gcloud artifacts docker images delete "${IMAGE_PATH}@${digest}" \
                --quiet --delete-tags 2>/dev/null || true
            fi
          done <<< "$DIGESTS"

          echo "Cleanup complete. Kept ${KEEP} most recent images."
