name: Send release email
description: Send a coreyalan.com-branded release notification via the Mailgun API.

inputs:
  to:
    description: Recipient email (the release owner's notification address).
    required: true
  company_email:
    description: >-
      Company/security address always CC'd for a central release audit trail.
      Set to a real mailbox or list; pass "" to disable.
    required: false
    default: security@coreyalan.com
  mailgun_api_key:
    description: Mailgun private API key.
    required: true
  mailgun_domain:
    description: Mailgun sending domain (e.g. coreyalan.com).
    required: true
  from:
    description: From header. Defaults to "Corey Alan Consulting <noreply@<domain>>".
    required: false
    default: ""
  github_token:
    description: Token used to render the release notes markdown to HTML.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Render and send release email
      shell: bash
      env:
        TO: ${{ inputs.to }}
        COMPANY: ${{ inputs.company_email }}
        MG_KEY: ${{ inputs.mailgun_api_key }}
        MG_DOMAIN: ${{ inputs.mailgun_domain }}
        FROM_IN: ${{ inputs.from }}
        GH_TOKEN: ${{ inputs.github_token }}
        # Release context (passed via env, never interpolated into the script).
        REPO: ${{ github.event.repository.name }}
        VERSION: ${{ github.event.release.tag_name }}
        URL: ${{ github.event.release.html_url }}
        NOTES: ${{ github.event.release.body }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        : "${TO:?recipient 'to' is required}"
        : "${MG_KEY:?mailgun_api_key is required}"
        : "${MG_DOMAIN:?mailgun_domain is required}"
        FROM="${FROM_IN:-Corey Alan Consulting <noreply@${MG_DOMAIN}>}"

        # Render the release notes (GitHub-flavored markdown) to HTML via the
        # GitHub API; fall back to the raw text wrapped in a <pre> on any failure.
        NOTES_HTML="$(curl -sS --fail \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/markdown \
          -d "$(jq -nc --arg t "${NOTES:-}" '{text:$t,mode:"gfm"}')" 2>/dev/null || true)"
        if [ -z "$NOTES_HTML" ]; then
          NOTES_HTML="<pre style=\"white-space:pre-wrap;font-family:inherit;\">$(jq -rn --arg t "${NOTES:-}" '$t' | sed 's/&/\&amp;/g;s/</\&lt;/g;s/>/\&gt;/g')</pre>"
        fi

        export REPO VERSION URL NOTES_HTML
        export YEAR="$(date -u +%Y)"
        export SUMMARY="${VERSION} is available"
        python3 "${ACTION_PATH}/render.py" "${ACTION_PATH}/release.html" > rendered.html

        # Always CC the company/security address (release audit trail) unless blank.
        cc_args=()
        [ -n "${COMPANY:-}" ] && cc_args+=(-F "cc=${COMPANY}")

        curl -sS --fail --user "api:${MG_KEY}" \
          "https://api.mailgun.net/v3/${MG_DOMAIN}/messages" \
          -F from="${FROM}" \
          -F to="${TO}" \
          ${cc_args[@]+"${cc_args[@]}"} \
          -F subject="🚀 ${REPO} ${VERSION} released" \
          -F text="${REPO} ${VERSION} is live: ${URL}" \
          -F html='<rendered.html'
        echo "Sent release email for ${REPO} ${VERSION} to ${TO}${COMPANY:+ (cc ${COMPANY})}"
