name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      app_name:
        description: "Application name"
        required: true
        type: string
      gcp_project_id:
        description: "GCP project ID where Artifact Registry lives"
        required: true
        type: string
      gcp_project_number:
        description: "GCP project number (for WIF provider path)"
        required: true
        type: string
      ar_repository:
        description: "Artifact Registry repo/image path (e.g. 'myapp/myimage')"
        required: true
        type: string
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      build_context:
        description: "Docker build context path"
        required: false
        type: string
        default: "."
      build_args:
        description: "Docker build arguments (newline-separated KEY=VALUE)"
        required: false
        type: string
        default: ""
      enable_image_cleanup:
        description: "Clean old images from Artifact Registry"
        required: false
        type: boolean
        default: true
      images_to_keep:
        description: "Number of recent images to keep"
        required: false
        type: number
        default: 10
      image_retention_days:
        description: "Delete non-release images older than this many days (releases with a v<semver> tag are always kept)"
        required: false
        type: number
        default: 90
      enable_security_scan:
        description: "Post-push Trivy image scan (blocking on fixable CRITICAL)"
        required: false
        type: boolean
        default: true
      registry:
        description: "Artifact Registry hostname"
        required: false
        type: string
        default: "us-central1-docker.pkg.dev"
      wif_provider_override:
        description: "Full WIF provider path (overrides convention)"
        required: false
        type: string
        default: ""
      wif_sa_override:
        description: "GCP service account email (overrides convention)"
        required: false
        type: string
        default: ""
      runner:
        description: |
          Runner label for the build job. Defaults to GitHub-hosted
          (ubuntu-latest), which is also the break-glass fallback. Pass a staging
          runner label (a homelab ARC scale set) to build on the staging cluster
          instead; the caller flips back to ubuntu-latest by overriding this input
          (manual break-glass). NOTE: a container build needs a docker-capable
          runner — a staging scale set used here must run in dind mode.
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      npm_auth_token:
        description: |
          Optional npm registry auth token for installing private scoped
          packages (e.g. @corey-alan-consulting/*). Forwarded to the Docker
          build as a BuildKit secret with id=npm_token. Consume it from
          within the Dockerfile via:
            RUN --mount=type=secret,id=npm_token ...
          The value is never written to image layers.
        required: false

concurrency:
  group: deploy-${{ inputs.app_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WIF_PROVIDER: ${{ inputs.wif_provider_override != '' && inputs.wif_provider_override || format('projects/{0}/locations/global/workloadIdentityPools/github-pool/providers/github-provider', inputs.gcp_project_number) }}
  WIF_SA: ${{ inputs.wif_sa_override != '' && inputs.wif_sa_override || format('github-actions@{0}.iam.gserviceaccount.com', inputs.gcp_project_id) }}
  IMAGE: ${{ inputs.registry }}/${{ inputs.gcp_project_id }}/${{ inputs.ar_repository }}

jobs:
  docker:
    name: Build & Push
    # Defaults to GitHub-hosted; pass a staging label to build on the homelab.
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ env.IMAGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for Artifact Registry
        env:
          REGISTRY: ${{ inputs.registry }}
        run: gcloud auth configure-docker "$REGISTRY"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Determine tags
        id: tags
        env:
          SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAGS="${IMAGE}:${SHA}"
          TAGS="${TAGS},${IMAGE}:latest"
          # Normalize Changesets-style "<pkg>@<semver>" tags to "v<semver>"
          # since '@' isn't legal in OCI image tags. Pass other shapes
          # through unchanged. See build-push-nextjs.yml for full rationale.
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ "$REF_NAME" == *"@"* ]]; then
              VERSION="v${REF_NAME##*@}"
            else
              VERSION="$REF_NAME"
            fi
            TAGS="${TAGS},${IMAGE}:${VERSION}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ inputs.build_args }}
          secrets: |
            npm_token=${{ secrets.npm_auth_token }}
          # SLSA provenance + SBOM attestations (parity with the in-repo builds).
          # Makes the artifact a multi-arch index — gitops-trigger handles index
          # digests (#658) and cosign signs the index digest below.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pin cosign — an unpinned installer floats and silently flipped v2->v3.
      - name: Sign image
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

  trivy-image-scan:
    name: Scan Image
    runs-on: ubuntu-latest
    needs: docker
    if: always() && needs.docker.result == 'success' && inputs.enable_security_scan
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for Artifact Registry
        env:
          REGISTRY: ${{ inputs.registry }}
        run: gcloud auth configure-docker "$REGISTRY"

      # Post-push: gates the human-merged prod PR via a failed check. Fixable CRITICAL.
      - name: Trivy image scan (gate on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ needs.docker.outputs.image }}@${{ needs.docker.outputs.digest }}"
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy SARIF report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          image-ref: "${{ needs.docker.outputs.image }}@${{ needs.docker.outputs.digest }}"
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always() && hashFiles('trivy-image-results.sarif') != ''
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image-generic

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: docker
    if: inputs.enable_image_cleanup
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Delete old images
        # Age-based retention that preserves the rollback story: releases carry
        # a v<semver> tag and are NEVER deleted, so a digest-repoint rollback to
        # any past release always resolves (the old count-based prune here could
        # delete released images). Mirrors build-push-nextjs.
        env:
          IMAGE_PATH: "${{ inputs.registry }}/${{ inputs.gcp_project_id }}/${{ inputs.ar_repository }}"
          KEEP: ${{ inputs.images_to_keep }}
          RETENTION_DAYS: ${{ inputs.image_retention_days }}
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d "${RETENTION_DAYS} days ago" +%s)
          echo "Retention: keep newest ${KEEP} + all v<semver> releases + anything <${RETENTION_DAYS}d; delete the rest."

          INDEX=0
          DELETED=0
          while IFS=$'\t' read -r DIGEST TAGS UPDATED; do
            [ -z "$DIGEST" ] && continue
            INDEX=$((INDEX + 1))

            # 1) Floor: always keep the newest N images.
            if [ "$INDEX" -le "$KEEP" ]; then continue; fi

            # 2) Never delete a released image (v<semver> tag) — the rollback target.
            if printf '%s' "$TAGS" | grep -Eq '(^|;)v?[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?(;|$)'; then
              echo "keep (release): ${DIGEST} [${TAGS}]"
              continue
            fi

            # 3) Keep anything inside the retention window; fail SAFE on
            #    unparseable timestamps rather than risk deleting.
            U=$(date -u -d "${UPDATED}" +%s 2>/dev/null || true)
            if [ -z "$U" ]; then echo "keep (unparseable time): ${DIGEST}"; continue; fi
            if [ "$U" -ge "$CUTOFF" ]; then continue; fi

            echo "delete: ${DIGEST} [${TAGS:-<untagged>}] (updated ${UPDATED})"
            gcloud artifacts docker images delete "${IMAGE_PATH}@${DIGEST}" --quiet --delete-tags 2>/dev/null || true
            DELETED=$((DELETED + 1))
          done < <(gcloud artifacts docker images list "${IMAGE_PATH}" \
                     --sort-by="~UPDATE_TIME" --include-tags \
                     --format="value(version,tags.join(';'),updateTime)" 2>/dev/null || true)

          echo "Cleanup complete. Deleted ${DELETED} old unreleased image(s)."
