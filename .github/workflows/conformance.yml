# =============================================================================
# Org conformance — the enforcement half of the paved road.
#
# Intended to run as an ORG-RULESET REQUIRED WORKFLOW on every PR in every app
# repo (Enterprise feature): standards stop being prose the moment this is a
# required check. Three mechanical gates, none repo-specific:
#
#   1. actionlint  — workflow schema/expression/shellcheck validation
#   2. zizmor      — action pinning + workflow security (policy from the
#                    repo's .github/zizmor.yml when present)
#   3. ci-gates    — SARIF uploads / Trivy exit-code gates / cosign steps must
#                    not be continue-on-error'd (standards/ci-cd.md)
#
# Rollout: the ruleset starts in EVALUATE mode — results are recorded on the
# rule insights page without blocking, so repos with a zizmor/actionlint
# backlog surface it before enforcement flips to active.
# =============================================================================

name: Org conformance

on:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    name: Workflow conformance
    # Skip in this repo's own PRs: deploy-workflows carries an acknowledged
    # zizmor backlog (template-injection refactor in build-push-*) tracked by
    # its own pr-checks zizmor job; the ruleset targets APP repos.
    if: github.repository != 'Corey-Alan-Consulting/deploy-workflows'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: zizmor
        run: |
          set -euo pipefail
          pipx install 'zizmor==1.29.0'
          # Offline audits only — deterministic, no API budget; the repo's own
          # .github/zizmor.yml policy applies automatically when present.
          # Gate at low+: informational findings (e.g. use-trusted-publishing
          # advice) print but must not fail an org-wide required check.
          zizmor --no-progress --min-severity=low .github/workflows

      - name: Non-negotiable CI gates are not softened
        run: |
          set -euo pipefail
          status=0
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$file" ] || continue
            awk -v file="$file" '
              function flush() {
                if (prot && soft) {
                  printf "%s:%d: %s is a non-negotiable gate and must not be continue-on-error\n", file, line, label
                  bad++
                }
                prot = 0; soft = 0; label = ""; line = 0
              }
              /^[[:space:]]*-[[:space:]]/ { flush(); line = NR }
              /upload-sarif/              { prot = 1; label = "CodeQL SARIF upload" }
              /exit-code:[[:space:]]*.1./ { prot = 1; label = "Trivy severity gate" }
              /cosign/                    { prot = 1; label = "image signing" }
              /continue-on-error:[[:space:]]*true/ { soft = 1 }
              END { flush(); exit (bad > 0) }
            ' "$file" || status=1
          done
          if [ "$status" -ne 0 ]; then
            echo ""
            echo "Fix by removing the continue-on-error, not by narrowing the gate."
            echo "See framework standards/ci-cd.md, 'Security gates — non-negotiable'."
            exit 1
          fi
          echo "CI gates intact."

      # An undefined input, an undeclared secret, or a missing required input
      # makes a reusable-workflow call fail the ENTIRE run at startup: no jobs,
      # no logs, no annotation, just `startup_failure`. It is the least
      # debuggable failure Actions produces, and it is pure caller error.
      #
      # dispatchr-social@0.4.10 shipped and never deployed because its worker
      # job passed `node_version` to build-push-generic.yml, which has no such
      # input -- of the seventeen workflows here, only build-push-nextjs.yml
      # declares one. Nothing caught it: actionlint does not resolve a remote
      # workflow's input list, and the release itself was green.
      #
      # Resolves against the ref each job actually pins, not main, because
      # callers sit on different versions.
      - name: Reusable-workflow inputs are declared
        shell: python3 {0}
        run: |
          """Assert every input and secret a caller passes is declared by the workflow it calls.

          A reusable workflow rejects an undefined input by failing the ENTIRE run at
          startup: no jobs, no logs, no annotation, just `startup_failure`. The same
          happens for an undeclared secret and for a missing required input. That is the
          least debuggable failure GitHub Actions produces, and it is pure caller error,
          so it belongs in a lint rather than in a release.

          Resolution is against the EXACT ref each job pins, not against main: callers
          sit on different versions, and checking main would both miss real breaks and
          invent false ones.
          """
          import glob, os, re, sys, urllib.error, urllib.request, yaml

          # Assembled rather than written out: an expression opener appearing literally
          # in a `run:` block is lexed as a GitHub expression by actionlint, which then
          # fails the workflow lint on this very file. Hence the concatenation below.
          EXPR = "$" + "{" + "{"

          ORG_WF = re.compile(
              r"^Corey-Alan-Consulting/deploy-workflows/\.github/workflows/([^@]+)@(.+)$"
          )
          RAW = "https://raw.githubusercontent.com/Corey-Alan-Consulting/deploy-workflows/{ref}/.github/workflows/{wf}"
          _cache = {}


          def declared(wf, ref):
              """(inputs, secrets) declared by `wf` at `ref`; None if unfetchable."""
              key = (wf, ref)
              if key in _cache:
                  return _cache[key]
              req = urllib.request.Request(
                  RAW.format(ref=ref, wf=wf), headers={"User-Agent": "conformance-input-lint"}
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      doc = yaml.safe_load(r.read()) or {}
              except (urllib.error.URLError, yaml.YAMLError) as e:
                  _cache[key] = None
                  print(f"    (could not fetch {wf}@{ref}: {e})")
                  return None
              # `on:` parses to the boolean True under YAML 1.1
              trig = doc.get("on") or doc.get(True) or {}
              call = (trig or {}).get("workflow_call") or {}
              out = ((call.get("inputs") or {}), (call.get("secrets") or {}))
              _cache[key] = out
              return out


          bad = False
          checked = 0

          for path in sorted(glob.glob(".github/workflows/*.y*ml")):
              try:
                  doc = yaml.safe_load(open(path)) or {}
              except yaml.YAMLError:
                  continue
              for job_name, job in (doc.get("jobs") or {}).items():
                  if not isinstance(job, dict):
                      continue
                  m = ORG_WF.match(str(job.get("uses", "")).strip())
                  if not m:
                      continue
                  wf, ref = m.group(1), m.group(2).split()[0]
                  if EXPR in ref:
                      print(f"  {path} :: {job_name} -> {wf}@<expression>, cannot resolve, skipped")
                      continue

                  spec = declared(wf, ref)
                  if spec is None:
                      print(f"::error file={path}::{job_name} calls {wf}@{ref}, which could not be "
                            "read. If the ref does not exist the run will fail at startup.")
                      bad = True
                      continue
                  inputs, secrets = spec
                  checked += 1
                  job_bad = False

                  passed_in = list((job.get("with") or {}).keys())
                  for k in passed_in:
                      if k not in inputs:
                          near = ", ".join(sorted(n for n in inputs if n.replace("-", "_") == k.replace("-", "_")))
                          hint = f" Did you mean: {near}?" if near else ""
                          print(f"::error file={path}::{job_name} passes `{k}` to {wf}, which declares "
                                f"no such input. The whole run will fail at startup with no logs.{hint}")
                          bad = job_bad = True

                  for k, meta in inputs.items():
                      if isinstance(meta, dict) and meta.get("required") and k not in passed_in:
                          print(f"::error file={path}::{job_name} does not pass required input `{k}` "
                                f"to {wf}. The run will fail at startup.")
                          bad = job_bad = True

                  sec_block = job.get("secrets")
                  if sec_block == "inherit" or sec_block is None:
                      pass
                  elif isinstance(sec_block, dict):
                      for k in sec_block:
                          if k not in secrets:
                              print(f"::error file={path}::{job_name} passes secret `{k}` to {wf}, "
                                    "which declares no such secret. The run will fail at startup.")
                              bad = job_bad = True
                      for k, meta in secrets.items():
                          if isinstance(meta, dict) and meta.get("required") and k not in sec_block:
                              print(f"::error file={path}::{job_name} does not pass required secret "
                                    f"`{k}` to {wf}. The run will fail at startup.")
                              bad = job_bad = True

                  if not job_bad:
                      print(f"  ok  {path} :: {job_name} -> {wf}@{ref[:12]} "
                            f"({len(passed_in)} inputs checked against {len(inputs)} declared)")

          if checked == 0:
              print("No deploy-workflows callers found.")
          if bad:
              print("\nEvery key in `with:` and `secrets:` must be declared by the workflow in `uses:`.")
              sys.exit(1)
          print(f"\n{checked} reusable-workflow call(s) validated.")

      # One Node version per app: tests, build, and the shipped image.
      #
      # app-pr-checks defaults to Node 22 and build-push-nextjs to Node 20 —
      # not a decision, just age (the build workflow is from 2026-03 when 20
      # was LTS, the PR gate from 2026-09 when 22 was). A repo that pins
      # neither therefore tests on one Node and builds on another, and the
      # image it ships is a third. app-template did exactly that and the split
      # cost ten weeks of red releases: a test calling `fs.globSync` (Node 22+)
      # passed PR checks on 22 and failed the release on 20 as
      # `TypeError: globSync is not a function` — so the assertion was dead on
      # the build Node AND it took the whole workflow down.
      #
      # This requires an EXPLICIT pin in both callers rather than comparing
      # against the defaults, because a check that encodes the defaults rots
      # the moment one of them moves. Three repos were already pinning by hand
      # (coreyalan.com, jlshaw.link, showcase), which is the signal this was
      # known and unenforced.
      - name: One Node version per app
        shell: python3 {0}
        run: |
          """Assert one Node major across the PR gate, the build, and the image.

          Parses the YAML rather than grepping: the input must come from the
          calling job's own `with:` block. A file-wide grep for `node-version`
          happily matches an unrelated `actions/setup-node` step in a different
          job, which is exactly the false positive that made this check report
          two repos as pinned when they were not.
          """
          import glob, os, re, sys, yaml

          def caller(workflow_name):
              """(file, with-block) of the job calling `workflow_name`."""
              for path in sorted(glob.glob(".github/workflows/*.y*ml")):
                  try:
                      doc = yaml.safe_load(open(path)) or {}
                  except yaml.YAMLError:
                      continue
                  for job in (doc.get("jobs") or {}).values():
                      if not isinstance(job, dict):
                          continue
                      if f"workflows/{workflow_name}.yml@" in str(job.get("uses", "")):
                          return path, (job.get("with") or {})
              return None, None

          pr_wf, pr_with = caller("app-pr-checks")
          dep_wf, dep_with = caller("build-push-nextjs")

          if not pr_wf and not dep_wf:
              print("Neither app-pr-checks nor build-push-nextjs is called here.")
              sys.exit(0)

          def major(v):
              m = re.match(r"^v?(\d+)", str(v or "").strip())
              return m.group(1) if m else None

          test_node = major((pr_with or {}).get("node-version"))
          build_node = major((dep_with or {}).get("node_version"))

          # The shipped image: deploy.yml's `dockerfile:` input, else
          # build-push-nextjs' own default.
          dockerfile = (dep_with or {}).get("dockerfile") or "Dockerfile.prebuilt"
          image_node = None
          if os.path.isfile(dockerfile):
              last = ""
              for line in open(dockerfile):
                  if line.strip().lower().startswith("from "):
                      last = line.split()[1]
              m = re.match(r"^node:(\d+)", last)
              image_node = m.group(1) if m else None

          print(f"  test  ({pr_wf or 'not called'}): {test_node or 'UNPINNED'}")
          print(f"  build ({dep_wf or 'not called'}): {build_node or 'UNPINNED'}")
          print(f"  image ({dockerfile}): {image_node or 'n/a'}")

          bad = False
          if pr_wf and not test_node:
              print(f"::error file={pr_wf}::node-version is not pinned on the app-pr-checks "
                    "call, so this repo tests on its default. Pin it to the Node the image ships.")
              bad = True
          if dep_wf and not build_node:
              print(f"::error file={dep_wf}::node_version is not pinned on the build-push-nextjs "
                    "call, so this repo builds on its default. Pin it to the Node the image ships.")
              bad = True
          for label, val in (("test", test_node), ("build", build_node)):
              if val and image_node and val != image_node:
                  print(f"::error::{label} Node is {val} but {dockerfile} ships node:{image_node}. "
                        "The prebuilt flow copies build output into that image, so these must match.")
                  bad = True

          if bad:
              print("\nPin one Node major on both calls and in the Dockerfile.")
              print("See framework standards/docker.md and standards/ci-cd.md.")
              sys.exit(1)
          print("Node version is consistent across tests, build and image.")
