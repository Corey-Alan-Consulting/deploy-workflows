# Reusable macOS desktop release (electron-builder + notarize + R2 beta feed).
#
# The caller keeps the `on: push: tags:` trigger and passes the extracted version
# + config. This workflow: shared build scaffold (desktop-build-setup) → decode
# the notarytool API key → electron-builder --mac (Developer ID sign + notarize,
# --publish never) → upload artifacts → publish to the R2 beta channel.
#
# CONVENTION — signing-secret-ids must map to these canonical env NAMEs:
#   APPLE_API_KEY_B64 · APPLE_API_KEY_ID · APPLE_API_ISSUER (notarytool)
#   CSC_LINK · CSC_KEY_PASSWORD                              (Developer ID cert)
#   R2_ACCOUNT_ID · R2_ACCESS_KEY_ID · R2_SECRET_ACCESS_KEY  (update feed)
# App-specific build env (e.g. LICENSE_JWKS from build-secret-ids, or a literal
# like REQUIRE_BAKED_JWKS) is inherited from the job env — set the latter by
# appending to $GITHUB_ENV inside prebuild-command.

name: Desktop release (macOS)

on:
  workflow_call:
    inputs:
      version:
        description: 'Marketing version being released (informational; electron-builder reads package.json)'
        required: false
        type: string
        default: ''
      runner:
        description: 'Runner label'
        required: false
        type: string
        default: macos-15-intel
      turbo-cache-environment:
        description: 'GitHub Environment whose branch policy gates the Turbo cache token'
        required: false
        type: string
        default: turbo-cache
      turbo-team:
        description: 'Per-app Turbo cache namespace'
        required: true
        type: string
      turbo-api:
        description: 'Turbo remote-cache base URL (org var TURBO_API)'
        required: false
        type: string
        default: ''
      app-directory:
        description: 'Directory holding the electron app + electron-builder config'
        required: false
        type: string
        default: apps/desktop
      output-dir:
        description: 'electron-builder output directory, relative to app-directory'
        required: false
        type: string
        default: release
      node-version:
        required: false
        type: string
        default: '22'
      build-command:
        description: 'Root workspace build (runs in desktop-build-setup)'
        required: false
        type: string
        default: 'pnpm run build'
      app-build-command:
        description: 'App build run in app-directory before electron-builder'
        required: false
        type: string
        default: 'pnpm build'
      prebuild-command:
        description: 'App-specific shell after the workspace build (e.g. FFmpeg); runs at repo root'
        required: false
        type: string
        default: ''
      electron-builder-args:
        description: 'Extra args appended to the electron-builder invocation'
        required: false
        type: string
        default: ''
      signing-secret-ids:
        description: 'bitwarden/sm-action mapping for signing + feed secrets (see header for required NAMEs)'
        required: true
        type: string
      build-secret-ids:
        description: 'bitwarden/sm-action mapping for app/build secrets (e.g. LICENSE_JWKS, SENTRY_AUTH_TOKEN)'
        required: false
        type: string
        default: ''
      r2-bucket:
        description: 'Cloudflare R2 update-feed bucket'
        required: true
        type: string
      installer-basename:
        description: 'Website installer basename, e.g. "Capturly" → Capturly-universal.dmg'
        required: true
        type: string
      publish:
        description: 'Publish to the R2 beta feed (set from the tag check in the caller)'
        required: false
        type: boolean
        default: true
    secrets:
      bws-token-signing:
        required: true
      bws-token-build:
        required: false
      npm-token:
        required: false
      turbo-token:
        required: false
      turbo-signature-key:
        required: false

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.turbo-cache-environment }}
    steps:
      - name: Build scaffold (checkout, secrets, install, build, prebuild)
        uses: Corey-Alan-Consulting/deploy-workflows/.github/actions/desktop-build-setup@v1
        with:
          node-version: ${{ inputs.node-version }}
          build-command: ${{ inputs.build-command }}
          prebuild-command: ${{ inputs.prebuild-command }}
          signing-secret-ids: ${{ inputs.signing-secret-ids }}
          build-secret-ids: ${{ inputs.build-secret-ids }}
          turbo-api: ${{ inputs.turbo-api }}
          turbo-team: ${{ inputs.turbo-team }}
          bws-token-signing: ${{ secrets.bws-token-signing }}
          bws-token-build: ${{ secrets.bws-token-build }}
          npm-token: ${{ secrets.npm-token }}
          turbo-token: ${{ secrets.turbo-token }}
          turbo-signature-key: ${{ secrets.turbo-signature-key }}

      # notarytool uses an App Store Connect API key (not an Apple ID + app
      # password, which silently invalidates when the Apple ID password changes).
      # electron-builder reads APPLE_API_KEY as a *path* to the .p8, so decode the
      # base64 secret to a file and export the path.
      - name: Prepare notarization API key
        shell: bash
        env:
          APPLE_API_KEY_B64: ${{ env.APPLE_API_KEY_B64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/apple_asc_api_key.p8"
          echo "$APPLE_API_KEY_B64" | base64 -d > "$KEY_PATH"
          test -s "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      # --publish never: artifacts go to the R2 feed below, never to a GitHub
      # release. Signing (CSC_*) + notarization (APPLE_API_*) env is inherited
      # from the secret fetch; do NOT also set APPLE_ID / APPLE_APP_SPECIFIC_
      # PASSWORD or electron-builder prefers that branch and ignores the key.
      - name: Build & sign macOS app
        working-directory: ${{ inputs.app-directory }}
        shell: bash
        env:
          APP_BUILD_COMMAND: ${{ inputs.app-build-command }}
          EXTRA_ARGS: ${{ inputs.electron-builder-args }}
        run: |
          set -euo pipefail
          eval "$APP_BUILD_COMMAND"
          # electron-builder can't auto-detect the Electron version from the
          # pnpm-linked node_modules in CI; read it from the installed package so
          # it always matches the lockfile.
          ELECTRON_VERSION="$(node -p "require('electron/package.json').version")"
          # shellcheck disable=SC2086 # EXTRA_ARGS is intentionally word-split
          pnpm exec electron-builder --mac --publish never \
            -c.electronVersion="$ELECTRON_VERSION" $EXTRA_ARGS

      - name: Upload macOS DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-dmg
          path: ${{ inputs.app-directory }}/${{ inputs.output-dir }}/*.dmg
          retention-days: 30

      - name: Upload macOS ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-zip
          path: ${{ inputs.app-directory }}/${{ inputs.output-dir }}/*.zip
          retention-days: 30

      # Publish the versioned .zip (+ .blockmap) and beta-mac.yml to the R2 beta
      # channel; stage the .dmg for a later approval-gated promotion to stable.
      - name: Publish to R2 update feed (beta channel)
        if: ${{ inputs.publish }}
        uses: Corey-Alan-Consulting/deploy-workflows/.github/actions/publish-desktop-feed@v1
        with:
          platform: mac
          bucket: ${{ inputs.r2-bucket }}
          installer-basename: ${{ inputs.installer-basename }}
          working-directory: ${{ inputs.app-directory }}/${{ inputs.output-dir }}
          r2-account-id: ${{ env.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ env.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ env.R2_SECRET_ACCESS_KEY }}
