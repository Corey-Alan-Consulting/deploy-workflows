name: Release Announcement (build)

# Reusable release-announcement builder — the replacement for the retired
# send-release-email action (which fired at tag-publish, pre-verification,
# and rendered the root package's always-empty changelog).
#
# Callers (a brand repo's .github/workflows/release-announce.yml) trigger
# this from the workflow_dispatch their Port automation fires when the
# promote_to_production run for their service succeeds. The builder:
#   1. resolves the released version from the newest app tag,
#   2. waits until prod is live (health gate mode per caller),
#   3. aggregates every per-package CHANGELOG section (hard-fails if empty),
#   4. drafts the artifact via the AI editorial pass,
#   5. upserts the draft on the coreyalan platform (schema enforced
#      server-side; the release key's source binding selects the tenant),
#   6. opens the `announce_release` Port approval run as platform-admin@
#      (SoD: the human approver cannot be the executor).
# Nothing here sends email — the send happens only from the approved Port
# run via the reusable release-announce-send.yml.

on:
  workflow_call:
    inputs:
      product_name:
        description: Brand name for the title and editorial prompt (e.g. Dispatchr).
        type: string
        required: true
      product_description:
        description: One clause describing the product for the editorial prompt.
        type: string
        required: true
      tag_prefix:
        description: App release tag prefix (e.g. "@dispatchr/web@") — the release.yml app-release-package tag.
        type: string
        required: true
      service:
        description: Port service entity identifier the announce_release approval run targets.
        type: string
        required: true
      version:
        description: Version override. Blank = newest tag matching tag_prefix.
        type: string
        default: ''
      health_url:
        description: Prod endpoint verified before announcing.
        type: string
        default: ''
      health_mode:
        description: 'version | status | skip. "status" suits apps whose health endpoint has no version field — the promote gate already verified the deploy.'
        type: string
        default: status
      changelog_url:
        description: Optional public changelog link included in the email.
        type: string
        default: ''
      channels_json:
        description: 'Optional JSON array of extra release channels: [{name, workflow, tagPrefix}].'
        type: string
        default: ''
      api_url:
        description: Base URL of the coreyalan platform.
        type: string
        default: https://coreyalan.com
      release_key_secret_id:
        description: Bitwarden secret id of the brand's sk_live_* release key (per-brand — its source binding selects the tenant).
        type: string
        required: true
      anthropic_secret_id:
        description: >-
          DEPRECATED, ignored. The editorial pass authenticates via workload
          identity federation (keyless); the input is kept only so existing
          callers don't break and will be removed once they stop passing it.
        type: string
        default: ''
    secrets:
      BWS_TOKEN_BUILD:
        description: Bitwarden machine token that can read the release-key secret.
        required: true
      BWS_TOKEN_PLATFORM:
        description: Bitwarden machine token that can read the Port API credential pair.
        required: true

permissions:
  contents: read
  actions: read # surface-matrix reads release-channel run conclusions
  id-token: write # federated (keyless) Anthropic auth for the editorial pass

jobs:
  build:
    name: Build announcement draft
    runs-on: ubuntu-latest
    timeout-minutes: 45 # includes the prod health wait (up to 20 min)

    steps:
      # Resolve the version before checkout so we can check out the tag
      # itself — the changelogs must be read at the released commit.
      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(gh api "repos/$REPO/git/matching-refs/tags/${TAG_PREFIX}" |
              jq -r --arg p "refs/tags/$TAG_PREFIX" \
                '[.[].ref | ltrimstr($p)] | sort_by(split(".") | map(tonumber)) | last')
          fi
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Could not resolve a semver version (got '$VERSION')"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_prefix }}${{ steps.version.outputs.version }}
          persist-credentials: false

      - name: Get builder secrets from Bitwarden
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BWS_TOKEN_BUILD }}
          secrets: |
            ${{ inputs.release_key_secret_id }} > COREYALAN_RELEASE_API_KEY

      # Keyless Anthropic auth: exchange this job's GitHub OIDC token for a
      # short-lived Anthropic access token. The federation rule is pinned to
      # THIS reusable workflow's job_workflow_ref, so only runs of this
      # builder (from any org repo) can mint a token — no per-brand API key,
      # nothing to rotate. All five ANTHROPIC_* values are non-secret ids.
      - name: Mint federated Anthropic token
        id: anthropic
        env:
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_01GwLBg4xSZAt7skCgZKeqZ1
          ANTHROPIC_ORGANIZATION_ID: 2be9142c-408a-457e-94b1-7b37ef7d0c6b
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01M4j7nr8VSftH1AkGL6tRqh
          ANTHROPIC_WORKSPACE_ID: wrkspc_01EUPu4heSAm6R2HCtMvFgUW
        run: |
          set -euo pipefail
          JWT=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value)
          RESPONSE=$(jq -n \
            --arg jwt "$JWT" \
            --arg rule "$ANTHROPIC_FEDERATION_RULE_ID" \
            --arg org "$ANTHROPIC_ORGANIZATION_ID" \
            --arg sa "$ANTHROPIC_SERVICE_ACCOUNT_ID" \
            --arg ws "$ANTHROPIC_WORKSPACE_ID" \
            '{grant_type:"urn:ietf:params:oauth:grant-type:jwt-bearer", assertion:$jwt,
              federation_rule_id:$rule, organization_id:$org,
              service_account_id:$sa, workspace_id:$ws}' |
            curl -sS -f https://api.anthropic.com/v1/oauth/token \
              -H 'content-type: application/json' --data @-) || {
            echo "::error::Anthropic token exchange failed — check the WIF authentication history in the Claude Console."; exit 1; }
          TOKEN=$(jq -r .access_token <<< "$RESPONSE")
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Anthropic token exchange returned no access_token."; exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Build and upsert draft
        id: draft
        uses: Corey-Alan-Consulting/deploy-workflows/.github/actions/build-release-announcement@main
        with:
          version: ${{ steps.version.outputs.version }}
          product_name: ${{ inputs.product_name }}
          product_description: ${{ inputs.product_description }}
          health_url: ${{ inputs.health_url }}
          health_mode: ${{ inputs.health_mode }}
          changelog_url: ${{ inputs.changelog_url }}
          channels_json: ${{ inputs.channels_json }}
          api_url: ${{ inputs.api_url }}
          anthropic_oauth_token: ${{ steps.anthropic.outputs.token }}
          release_api_key: ${{ env.COREYALAN_RELEASE_API_KEY }}
          github_token: ${{ github.token }}

      # Open the approval run AS platform-admin@ — the promotion-gate
      # pattern. An org token is required for run_as. The ids are the
      # "Port Actions" project's copy of the Port credential pair, so the
      # BWS_TOKEN_PLATFORM machine account reads ONLY that tiny project —
      # never Platform Infrastructure.
      - name: Load Port API creds from Bitwarden
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BWS_TOKEN_PLATFORM }}
          secrets: |
            d8bd8a0f-0853-4434-837b-b4a3002a4ed4 > PORT_CLIENT_ID
            0ab68808-64c7-403e-a1e6-b4a3002a5166 > PORT_CLIENT_SECRET

      - name: Open Port approval run (run_as platform-admin@)
        env:
          ANNOUNCEMENT_ID: ${{ steps.draft.outputs.announcement_id }}
          VERSION: ${{ steps.draft.outputs.announcement_version }}
          SERVICE: ${{ inputs.service }}
          RUN_AS: platform-admin@coreyalan.com
        run: |
          set -euo pipefail
          PTOK=$(curl -sS -X POST https://api.port.io/v1/auth/access_token \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg id "$PORT_CLIENT_ID" --arg s "$PORT_CLIENT_SECRET" '{clientId:$id, clientSecret:$s}')" | jq -r .accessToken)
          if [ -z "$PTOK" ] || [ "$PTOK" = "null" ]; then echo "::error::Port auth failed"; exit 1; fi

          BODY=$(jq -n --arg e "$SERVICE" --arg aid "$ANNOUNCEMENT_ID" --arg v "$VERSION" \
            '{entity:$e, properties:{announcement_id:$aid, version:$v}}')
          HTTP=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            "https://api.port.io/v1/actions/announce_release/runs?run_as=${RUN_AS}" \
            -H "Authorization: Bearer $PTOK" \
            -H 'Content-Type: application/json' \
            -d "$BODY")
          echo "Port responded $HTTP"; cat /tmp/resp.json || true
          case "$HTTP" in
            2*) echo "Announce-release run opened for $VERSION — awaiting human approval in Port." ;;
            *)  echo "::error::Port run creation failed (HTTP $HTTP)"; exit 1 ;;
          esac
