name: Release

# Reusable Changesets release + npm publish (OIDC) workflow.
#
# Callers (a package repo's .github/workflows/release.yml) trigger this on push
# to main. It does ONE of two things per run:
#   1. Pending .changeset/*.md exist -> open/update a "chore: release packages"
#      PR that bumps versions, regenerates CHANGELOGs, and consumes changesets.
#   2. That PR merged (no pending changesets) -> `changeset tag` writes any
#      missing git tags, then every non-private package whose COMMITTED version
#      is not on npm is `npm publish`ed over OIDC, and GitHub Releases are cut
#      for what landed. All of it is driven by state, not by what this run
#      created, so a run that fails partway is fixed by re-running it.
#
# Why `changeset tag` + explicit `npm publish` (not `changeset publish`)?
#   npm Trusted Publishing OIDC is documented for the npm CLI only; pnpm's OIDC
#   support is undocumented and broke across the pnpm 10->11 transition. We
#   version with Changesets and publish on the supported npm CLI path.
#
# Caller requirements:
#   - pnpm workspace with a `version-packages` script. Use the retry wrapper
#     (`node scripts/changeset-version-retry.mjs && pnpm install --lockfile-only`)
#     rather than a bare `changeset version`: @changesets/changelog-github makes a
#     GitHub GraphQL call per changeset that intermittently fails with
#     ERR_STREAM_PREMATURE_CLOSE, and the wrapper retries it.
#   - .changeset/config.json present.
#   - Each publishable package registers an npm Trusted Publisher (see README:
#     the OIDC `workflow` claim is the CALLER's release.yml, so keep that
#     filename and point the publisher at the package repo + release.yml).
#   - GITOPS_APP_ID / GITOPS_APP_PRIVATE_KEY available to the caller repo.

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version for the publish job. 22+ required for npm OIDC.
        type: string
        default: '24'
      app-release-package:
        description: >-
          Optional workspace package name (e.g. a private deployable app). When
          set and that package is in the published set, cut a GitHub Release
          `<name>@<version>` from its CHANGELOG so `release: published`
          downstream workflows fire. Empty = no app release.
        type: string
        default: ''
    secrets:
      GITOPS_APP_ID:
        description: GitHub App id used to push version commits/tags past branch protection.
        required: true
      GITOPS_APP_PRIVATE_KEY:
        description: GitHub App private key paired with GITOPS_APP_ID.
        required: true
      NPM_TOKEN:
        description: >-
          Optional npm read token, used only to install restricted
          @scope/* dependencies during `pnpm install`. Publishing stays on
          OIDC Trusted Publishing — this token never publishes. Omit for repos
          with no private registry dependencies.
        required: false

# Serialize release runs: two quick pushes to main would otherwise race on
# tag pushes and GitHub Release creation. Never cancel an in-flight release —
# it may have already npm-published and only have the release step left to do.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for npm Trusted Publishing OIDC: the npm CLI mints + exchanges a
  # short-lived token at publish time. No NPM_TOKEN secret needed.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          # Least-privilege: scope the installation token instead of inheriting
          # the App's blanket permissions. contents:write pushes the version
          # commit + tags; pull-requests:write manages the release PR.
          permission-contents: write
          permission-pull-requests: write

      # zizmor: ignore[artipacked]
      # The persisted credential is the POINT here, and the `token:` line below
      # has said so since it was written: changesets pushes the version commit
      # and tags from this checkout. Unlike the build workflows - where nothing
      # used the token after checkout and it was dropped - removing it here
      # breaks releases.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The App token persists so the changesets action can push the version
          # commit + tags. This intentionally keeps credentials in the checkout.
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Node 22 ships npm 10.x; npm 11.5.1+ gates Trusted Publishing OIDC.
      # zizmor: ignore[adhoc-packages]
      # Required, not convenience: the comment above is the whole reason. Node
      # 22 ships npm 10.x and Trusted Publishing OIDC needs 11.5.1+, so the
      # alternative to this ad-hoc upgrade is publishing with a long-lived
      # token - which is what the use-trusted-publishing audit asks us to
      # avoid. Pinned to @latest deliberately: a pinned npm would go stale
      # against npm's own OIDC gate.
      - name: Upgrade npm to OIDC-capable version
        run: npm install -g npm@latest

      - name: Install dependencies
        # NODE_AUTH_TOKEN is scoped to this step only, so it authenticates the
        # install of restricted deps without leaking into the OIDC publish step
        # (setup-node wrote an .npmrc that reads this var; empty = no auth).
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Create Release PR or tag versions
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # changesets/action v2 renamed these inputs and hard-errors on the
          # old names — the dependabot v2 bump landed without this migration.
          version-script: pnpm version-packages
          # `changeset tag` creates the git tags for every version not yet
          # tagged and publishes nothing. Its `published-packages` output lists
          # only tags NEW to this run, so nothing below reads it: on a re-run
          # the tags already exist and the list is empty, which is exactly how
          # a partial release used to become unrecoverable (2026-11-02).
          publish-script: pnpm exec changeset tag
          commit-message: 'chore: release packages'
          pr-title: 'chore: release packages'
          # Always false: the "Create GitHub Releases" step below cuts them,
          # after the publish and idempotently. The action's own creation runs
          # BEFORE anything reaches npm and fails with `already_exists` on any
          # re-run, so a package whose publish failed was left Released but
          # unpublished and the retry could not get past this step. It also
          # wrote each tag ref twice (Release + tag push), which double-fired
          # `push: tags` deploys (gatherbee@0.3.0).
          create-github-releases: false
          # Explicit because it is no longer implied once the above is false,
          # and because a release that pushes no tag is a release nothing can
          # deploy.
          push-git-tags: true
          # v2 pushes via the GitHub API by default (signed commits/tags; the
          # old commitMode input was removed) and takes the token as an INPUT —
          # a GITHUB_TOKEN env var that differs from it is a hard error.
          github-token: ${{ steps.app-token.outputs.token }}

      # Everything from here to the parity check is driven by STATE (the
      # version committed at GITHUB_SHA, the registry, the tags, the existing
      # Releases), never by what this run happened to create. That is what
      # makes a failed release recoverable by "Re-run jobs": each step redoes
      # only what is still missing.
      #
      # Publish mode only. `has-changesets` is true in version-PR mode, where
      # the tree holds the NEXT versions on the release branch.
      - name: Plan npm publishes
        id: plan
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          # Read-only token, same as the install step. Publishing stays on OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # One row per workspace package:
          #   name  version  dir  tag  here  state  action
          # here   = its tag points at GITHUB_SHA (this commit released it)
          # state  = private | present | missing | unreadable (on npm)
          # action = publish | none
          plan="$RUNNER_TEMP/release-plan.tsv"
          : > "$plan"
          pnpm list -r --depth -1 --json > "$RUNNER_TEMP/release-pkgs.json"
          total="$(jq 'length' "$RUNNER_TEMP/release-pkgs.json")"
          count=0

          while IFS=$'\t' read -r name dir; do
            [ -n "$name" ] || continue
            rel="${dir#"$GITHUB_WORKSPACE"}"
            rel="${rel#/}"
            # Only a version COMMITTED at the pushed ref is ever a candidate.
            version="$(git show "${GITHUB_SHA}:${rel:+$rel/}package.json" 2>/dev/null \
              | jq -r '.version // empty')" || version=""
            if [ -z "$version" ]; then
              echo "  skip        ${name}: no version committed at ${GITHUB_SHA}"
              continue
            fi

            # Changesets tags a single-package (root) repo `v<version>`.
            tag="${name}@${version}"
            if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null && [ "$total" = 1 ]; then
              tag="v${version}"
            fi
            here=false
            if [ "$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" || true)" = "$GITHUB_SHA" ]; then
              here=true
            fi

            action=none
            if [ "$(jq -r '.private // false' "$dir/package.json")" = "true" ]; then
              state=private
            elif [ "$(npm view "${name}@${version}" version 2>/dev/null || true)" = "$version" ]; then
              state=present
            elif npm view "$name" name >/dev/null 2>&1; then
              # Readable, and this version is not there: publish it, whether or
              # not its tag is new.
              state=missing
              action=publish
            else
              # npm answers 404 for unauthorized exactly as for absent, so this
              # cannot tell. Publish only on the commit that tagged it; a
              # publish of a version that is already there is refused by npm
              # and treated as done below.
              state=unreadable
              [ "$here" = true ] && action=publish
            fi

            if [ "$action" = publish ]; then
              tree="$(jq -r '.version // empty' "$dir/package.json")"
              if [ "$tree" != "$version" ]; then
                echo "::error title=Version drift::${name} is ${version} at ${GITHUB_SHA} but ${tree} in the working tree. Refusing to publish a version that is not committed."
                exit 1
              fi
              count=$((count + 1))
            fi
            at=""
            [ "$here" = false ] || at=" at this commit"
            echo "  ${action}  ${name}@${version} (${state}, tag ${tag}${at})"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$name" "$version" "$dir" "$tag" "$here" "$state" "$action" >> "$plan"
          done < <(jq -r '.[] | [.name, .path] | @tsv' "$RUNNER_TEMP/release-pkgs.json")

          echo "publish-count=${count}" >> "$GITHUB_OUTPUT"
          echo "${count} package(s) to publish."

      - name: Build library packages (topological)
        if: steps.plan.outputs.publish-count != '0' && steps.plan.outputs.publish-count != ''
        # The publish loop below iterates in workspace-discovery (alphabetical)
        # order, NOT dependency order — a package whose workspace deps sort
        # after it (e.g. audit -> platform-kernel) needs those deps' dist/
        # built BEFORE its own build runs. `pnpm -r run` is topological, so
        # one recursive build here fixes ordering for every package. Scoped to
        # packages/** so an app repo's root `next build` never runs; packages
        # without a build/smoke script are skipped by recursive run semantics.
        run: |
          set -euo pipefail
          if [ -d packages ]; then
            # --if-present: pnpm recursive run HARD-FAILS when no selected
            # package has the script (it only "skips" when at least one does) —
            # a repo whose packages define build but no smoke died here.
            pnpm --filter './packages/**' run --if-present build
            pnpm --filter './packages/**' run --if-present smoke
          fi

      - name: Publish changed packages to npm (OIDC)
        id: publish
        if: steps.plan.outputs.publish-count != '0' && steps.plan.outputs.publish-count != ''
        run: |
          set -euo pipefail
          # One failure must not strand the rest: publish every candidate,
          # then fail the step naming the ones that did not land.
          done_file="$RUNNER_TEMP/release-published.txt"
          log="$RUNNER_TEMP/npm-publish.log"
          tgz="$RUNNER_TEMP/publish-package.tgz"
          : > "$done_file"
          failed=""
          while IFS=$'\t' read -r name version dir _tag _here _state action; do
            [ "$action" = publish ] || continue
            : > "$log"
            rm -f "$tgz"
            echo "::group::Publishing ${name}@${version} from ${dir}"
            # pnpm pack rewrites `workspace:^` dependency ranges to the real
            # versions in the tarball manifest — a bare `npm publish` ships
            # them verbatim, producing packages consumers cannot install. The
            # publish itself stays on the npm CLI (the documented OIDC Trusted
            # Publishing path). Tarball publishes do not run prepublishOnly:
            # the explicit build+smoke step above replaces it in CI, while
            # prepublishOnly still guards manual publishes.
            if ( cd "$dir" && pnpm pack --out "$tgz" ) \
              && npm publish "$tgz" --access restricted 2>&1 | tee "$log"; then
              echo "$name" >> "$done_file"
            elif grep -qiE 'cannot publish over (the )?previously published version|EPUBLISHCONFLICT' "$log"; then
              echo "${name}@${version} is already on the registry."
              echo "$name" >> "$done_file"
            else
              failed="${failed} ${name}@${version}"
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/release-plan.tsv"

          if [ -n "$failed" ]; then
            echo "::error title=npm publish failed::Not published:${failed}. Everything else was published and released. Fix the cause (an npm 404 here usually means the package has no Trusted Publisher for this repo + release.yml) and re-run the job: it publishes only what is still missing from the registry."
            exit 1
          fi

      # Runs even when a publish failed, so the packages that DID land get
      # their Release now; the failed ones are skipped and picked up on the
      # re-run. Uses the App token so `release: published` can trigger other
      # workflows. Never creates a tag (`--verify-tag`): the tag is pushed by
      # the step above, and a second write of it would re-fire `push: tags`.
      - name: Create GitHub Releases
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_PACKAGE: ${{ inputs.app-release-package }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          done_file="$RUNNER_TEMP/release-published.txt"
          [ -f "$done_file" ] || : > "$done_file"
          failed=""
          while IFS=$'\t' read -r name version dir tag here state _action; do
            # Only the commit that tagged a version releases it; a later push
            # must not cut Releases for older versions.
            [ "$here" = true ] || continue
            if [ -n "$APP_PACKAGE" ]; then
              # App repos: one Release, for the app. It fires the deploy and
              # the announcement, so hold it until every publish has landed.
              [ "$name" = "$APP_PACKAGE" ] || continue
              if [ "$PUBLISH_OUTCOME" = failure ]; then
                echo "::warning::Holding the ${tag} Release until the failed publish is fixed; the re-run creates it."
                continue
              fi
            fi
            case "$state" in
              private | present) ;;
              *)
                if ! grep -qxF "$name" "$done_file"; then
                  echo "Skipping ${tag}: not on the registry yet."
                  continue
                fi
                ;;
            esac
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release ${tag} already exists."
              continue
            fi

            # This version's CHANGELOG section (## <version> .. next ## ).
            # Best-effort: a missing or empty changelog must not leave a
            # published version with no Release. Fall back to a minimal note.
            notes=""
            if [ -f "${dir}/CHANGELOG.md" ]; then
              notes="$(awk -v hdr="## ${version}" '
                $0 == hdr { capture = 1; next }
                /^## / && capture { exit }
                capture { print }
              ' "${dir}/CHANGELOG.md")"
            else
              echo "::warning::No CHANGELOG at ${dir}/CHANGELOG.md; using fallback release notes."
            fi
            [ -n "$notes" ] || notes="Release ${tag}"
            notes_file="$(mktemp)"
            printf '%s\n' "$notes" > "$notes_file"
            pre=()
            case "$version" in *-*) pre=(--prerelease) ;; esac
            if gh release create "$tag" --verify-tag --title "$tag" --notes-file "$notes_file" ${pre[@]+"${pre[@]}"}; then
              echo "Created Release ${tag}."
            else
              failed="${failed} ${tag}"
            fi
          done < "$RUNNER_TEMP/release-plan.tsv"

          if [ -n "$failed" ]; then
            echo "::error title=GitHub Release failed::Could not create:${failed}. Re-run the job; existing Releases are skipped."
            exit 1
          fi

      # Post-condition for the whole workflow. Runs in both modes, and even
      # after a failed step: after a publish it confirms the publish actually
      # landed, and on a version-PR run it confirms nothing has silently
      # fallen out of the registry.
      - name: Verify every package version reached the registry
        if: ${{ !cancelled() }}
        env:
          # Read-only token, same as the install step. Publishing stays on OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          # Post-condition for the whole workflow, not just the publish step: every
          # non-private workspace package's CURRENT version must exist on the registry.
          #
          # This is the check that was missing when crm-csv 0.1.2 was versioned, tagged
          # and committed to main while the publish step silently skipped -- the job went
          # green, the tag never reached the remote, and the gap was only noticed weeks
          # later when a consumer still resolved the vulnerable 0.1.1.
          #
          # Deliberately scoped to CURRENT versions rather than every historical tag.
          # Comparing all tags would permanently flag six pre-existing holes from the
          # June scaffolding (crm-core 0.1.0, crm-prisma 0.1.0, lms-content 0.1.0,
          # lms-courses 0.2.0, lms-quiz 0.1.0, lms-roster 0.1.0) that are superseded by
          # later published releases and referenced by nobody -- noise that would need an
          # allowlist and would train people to ignore this check. Current-version parity
          # is the invariant that actually matters and it has no known false positives.
          pnpm list -r --depth -1 --json > "$RUNNER_TEMP/release-parity.json"

          missing=""
          unreadable=""
          checked=0

          while IFS=$'\t' read -r name version dir; do
            [ -n "$name" ] || continue
            [ -f "$dir/package.json" ] || continue
            # Private packages are versioned and tagged (a deployable app gets its
            # `app@<v>` tag) but never published, so they have nothing to verify.
            if [ "$(jq -r '.private // false' "$dir/package.json")" = "true" ]; then
              continue
            fi
            # Verify the version COMMITTED at the pushed ref, not the working tree.
            # In version-PR mode changesets/action checks out changeset-release/<branch>
            # and runs the version script before this step, so the tree holds the
            # NEXT versions, which are unpublished by design. Reading them here
            # reported every package as MISSING the first time a release PR was
            # pending for packages that already existed on npm (pos-platform,
            # 2026-10-22). The committed version is the one a consumer can resolve.
            rel="${dir#"$GITHUB_WORKSPACE"}"
            rel="${rel#/}"
            if committed="$(git show "${GITHUB_SHA}:${rel:+$rel/}package.json" 2>/dev/null | jq -r '.version')" \
              && [ -n "$committed" ] && [ "$committed" != "null" ]; then
              version="$committed"
            fi
            checked=$((checked + 1))
            if [ "$(npm view "${name}@${version}" version 2>/dev/null || true)" = "$version" ]; then
              echo "  ok        ${name}@${version}"
            elif npm view "$name" name >/dev/null 2>&1; then
              # The package is readable but this version is not there: a real hole.
              echo "  MISSING   ${name}@${version}"
              missing="${missing} ${name}@${version}"
            else
              # The package itself is unreadable. These are `access: restricted`, and npm
              # answers 404 for unauthorized exactly as it does for absent, so this is an
              # auth problem and must not be reported as a missing release.
              echo "  UNREADABLE ${name} (cannot distinguish absent from unauthorized)"
              unreadable="${unreadable} ${name}"
            fi
          done < <(jq -r '.[] | [.name, .version, .path] | @tsv' "$RUNNER_TEMP/release-parity.json")

          if [ -n "$unreadable" ]; then
            # WARN, never fail. Inability to verify is not evidence of a problem,
            # and a verification step must not be able to break a working
            # release. A repo that omits the optional NPM_TOKEN secret reported
            # every package unreadable on its first run of this check and
            # failed a release that had nothing to publish. npm answers 404
            # identically for unauthorized and absent, so the honest outcome
            # here is "could not verify", not "broken".
            echo "::warning title=Registry parity unverified::Could not read these packages from npm:${unreadable}. npm returns 404 for both 'unpublished' and 'unauthorized', so this is not evidence of a missing release -- it means parity could not be checked. Pass the optional NPM_TOKEN secret to this workflow to enable it."
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Version not on the registry::These versions are committed but not on npm:${missing}. Publishing is driven by registry state, so re-running the release run for this commit (once nothing is pending in .changeset/) publishes exactly what is missing -- no tag or Release needs deleting."
            exit 1
          fi
          if [ -n "$unreadable" ]; then
            echo "Registry parity checked for ${checked} package(s); some could not be read (see warning above)."
          else
            echo "Registry parity verified for ${checked} published package(s)."
          fi
