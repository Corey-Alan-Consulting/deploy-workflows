# Reusable Android release (signed AAB → Google Play track, keyless WIF).
# Inputs, signing-secret NAMEs and examples: README "Reusable Workflows — mobile release".

name: Android release

on:
  workflow_call:
    inputs:
      package-name:
        description: 'applicationId, e.g. com.example.app'
        required: true
        type: string
      app-directory:
        required: false
        type: string
        default: apps/mobile
      runner:
        required: false
        type: string
        default: ubuntu-latest
      # A cold release build compiles the RN C++ core, reanimated and worklets
      # for every ABI in `reactNativeArchitectures` — tens of minutes with no
      # warm Gradle cache (tag refs can't read a branch cache). Budget well
      # above the observed build so a slow runner never guillotines the Play
      # upload after a good AAB was already produced.
      build-timeout-minutes:
        required: false
        type: number
        default: 90
      node-version:
        required: false
        type: string
        default: '24'
      npm-scope:
        required: false
        type: string
        default: '@corey-alan-consulting'
      java-version:
        required: false
        type: string
        default: '17'
      java-distribution:
        required: false
        type: string
        default: zulu
      workspace-build-filter:
        description: 'pnpm --filter selector to compile workspace deps before bundling (e.g. "@example/mobile^..."). Empty = skip.'
        required: false
        type: string
        default: ''
      prebuild-command:
        description: 'Generates the native android/ project before Gradle, run in app-directory (Expo CNG, e.g. "pnpm exec expo prebuild -p android --clean --no-install"). Empty = the app commits android/.'
        required: false
        type: string
        default: ''
      gradle-cache:
        description: 'Cache ~/.gradle (dependencies and wrapper) keyed on the lockfile. A tag or dispatch run restores the default branch''s cache.'
        required: false
        type: boolean
        default: true
      gradle-command:
        required: false
        type: string
        default: './gradlew bundleRelease --no-daemon'
      apk-path:
        description: 'Signed APK path relative to app-directory, uploaded as an artifact for sideloading (add assembleRelease to gradle-command). Empty = no APK.'
        required: false
        type: string
        default: ''
      aab-path:
        description: 'AAB path relative to app-directory'
        required: false
        type: string
        default: android/app/build/outputs/bundle/release/app-release.aab
      forbidden-manifest-permissions:
        description: 'Regex of permissions that must NOT appear in the merged manifest (e.g. "AD_ID|READ_MEDIA_IMAGES"). Empty = skip the check.'
        required: false
        type: string
        default: ''
      expected-cert-sha256:
        description: 'SHA-256 of the signing certificate (hex, colons and case ignored). When set, the AAB (and the APK, if apk-path is set) must be signed by exactly this certificate. Empty = skip the check.'
        required: false
        type: string
        default: ''
      signing-environment:
        description: 'GitHub Environment (in the caller repo) for the build job, which reads the signing secrets. Its protection rules apply and its secrets resolve in the job. Empty = no environment.'
        required: false
        type: string
        default: ''
      merged-manifest-path:
        description: 'Merged manifest path relative to app-directory. Empty = the single AndroidManifest.xml under android/app/build/intermediates/merged_manifests/release/.'
        required: false
        type: string
        default: ''
      track:
        description: 'Play track to upload to'
        required: false
        type: string
        default: alpha
      status:
        description: 'Play release status (completed | draft | inProgress | halted)'
        required: false
        type: string
        default: completed
      gcp-project:
        required: true
        type: string
      wif-provider:
        description: 'Full workloadIdentityPools provider resource path'
        required: true
        type: string
      wif-service-account:
        description: 'Play publisher service account email'
        required: true
        type: string
      signing-secret-ids:
        required: true
        type: string
      build-secret-ids:
        required: false
        type: string
        default: ''
      publish:
        required: false
        type: boolean
        default: true
    secrets:
      bws-token-signing:
        required: true
      bws-token-build:
        required: false
      npm-token:
        required: false

permissions:
  contents: read
  id-token: write # mint the WIF OIDC token for keyless Google auth

jobs:
  build-release:
    name: Build signed AAB
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.build-timeout-minutes }}
    environment: ${{ inputs.signing-environment }}
    defaults:
      run:
        working-directory: ${{ inputs.app-directory }}
    steps:
      # A secret passed by name that exists nowhere resolves to '' without an
      # error; fail here, before any setup, rather than at Bitwarden.
      - name: Check signing token is present
        working-directory: .
        shell: bash
        env:
          BWS_TOKEN_SIGNING: ${{ secrets.bws-token-signing }}
        run: |
          if [ -z "$BWS_TOKEN_SIGNING" ]; then
            echo "::error::bws-token-signing is empty. Store BWS_TOKEN_SIGNING as a repo secret or a secret of signing-environment, and pass it by name."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The signed release builds all ABIs, which exhausts the ~14 GB free on
      # ubuntu-latest. Reclaim space by dropping preinstalled toolchains this job
      # never touches.
      - name: Free up disk space
        working-directory: .
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
      # zizmor: ignore[use-trusted-publishing]
      # FALSE POSITIVE, and the token is the reason it looks like one: the
      # NODE_AUTH_TOKEN below authenticates `pnpm install` of RESTRICTED
      # first-party packages, not a publish. `npm publish` appears nowhere
      # in this workflow - it ships to a store, not to a registry - and
      # registry-url is set only so .npmrc exists for the read side.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
          scope: ${{ inputs.npm-scope }}
          always-auth: true

      # Retry: @prisma/engines postinstall fetches over the network and
      # intermittently aborts; reinstall is idempotent under a frozen lockfile.
      - name: Install dependencies
        working-directory: .
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
        run: |
          attempt=1
          max=3
          until pnpm install --frozen-lockfile; do
            if [ "$attempt" -ge "$max" ]; then
              echo "pnpm install failed after ${max} attempts"
              exit 1
            fi
            echo "pnpm install failed (attempt ${attempt}/${max}), retrying in $((attempt * 15))s…"
            sleep $((attempt * 15))
            attempt=$((attempt + 1))
          done

      # Metro resolves workspace deps via their built "exports", so compile them
      # first (topological; --if-present skips buildless packages).
      - name: Build workspace deps
        if: ${{ inputs.workspace-build-filter != '' }}
        working-directory: .
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
          FILTER: ${{ inputs.workspace-build-filter }}
        run: pnpm --filter "$FILTER" --if-present build

      # Expo continuous native generation: android/ is not committed, so the
      # native project is generated from app.config before Gradle runs. Env
      # from the earlier steps (e.g. variant selection) is inherited.
      - name: Generate native project
        if: ${{ inputs.prebuild-command != '' }}
        shell: bash
        env:
          PREBUILD_COMMAND: ${{ inputs.prebuild-command }}
        run: |
          set -euo pipefail
          eval "$PREBUILD_COMMAND"
          test -f android/gradlew

      # Dependencies and the Gradle wrapper only (not build outputs): they are
      # what a cold release spends most of its download time on, and they are
      # safe to share across builds. Caches are written on the default branch
      # by any run there and read by tag and dispatch runs too.
      - name: Restore Gradle cache
        id: gradle-cache
        if: ${{ inputs.gradle-cache }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ inputs.java-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ inputs.java-version }}-

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The action's default package list still includes legacy 'tools',
          # which Google removed — the runners' cmdline-tools 20 sdkmanager
          # exits 1 on it. Gradle installs build-tools/platforms itself.
          packages: platform-tools

      - name: Load signing secrets
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.bws-token-signing }}
          secrets: ${{ inputs.signing-secret-ids }}

      - name: Load app secrets
        if: ${{ inputs.build-secret-ids != '' }}
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.bws-token-build }}
          secrets: ${{ inputs.build-secret-ids }}

      - name: Materialize keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ env.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          test -s "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      # Gradle reads ANDROID_KEYSTORE_PATH / *_PASSWORD / KEY_ALIAS from the env
      # (inherited); SENTRY_AUTH_TOKEN too if build-secret-ids provided it.
      - name: Build release bundle
        id: gradle
        shell: bash
        env:
          GRADLE_COMMAND: ${{ inputs.gradle-command }}
        run: |
          set -euo pipefail
          cd android
          eval "$GRADLE_COMMAND"

      # Saved once Gradle succeeds, even if a later check fails, so a re-run
      # doesn't download every dependency again.
      - name: Save Gradle cache
        if: ${{ always() && inputs.gradle-cache && steps.gradle.outcome == 'success' && steps.gradle-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Verify signing certificate
        if: ${{ inputs.expected-cert-sha256 != '' }}
        # `$/` resolves to this repository at the commit already running, so a
        # SHA-pinned caller runs the action from that same SHA.
        uses: $/.github/actions/verify-signing-cert
        with:
          bundle: ${{ inputs.app-directory }}/${{ inputs.aab-path }}
          apk: ${{ inputs.apk-path != '' && format('{0}/{1}', inputs.app-directory, inputs.apk-path) || '' }}
          expected-sha256: ${{ inputs.expected-cert-sha256 }}

      - name: Verify 16KB page alignment
        uses: $/.github/actions/verify-aab-alignment
        with:
          bundle: ${{ inputs.app-directory }}/${{ inputs.aab-path }}

      - name: Verify merged manifest is policy-clean
        if: ${{ inputs.forbidden-manifest-permissions != '' }}
        shell: bash
        env:
          MANIFEST: ${{ inputs.merged-manifest-path }}
          FORBIDDEN: ${{ inputs.forbidden-manifest-permissions }}
        run: |
          set -euo pipefail
          if [ -z "$MANIFEST" ]; then
            dir=android/app/build/intermediates/merged_manifests/release
            matches=()
            if [ -d "$dir" ]; then
              mapfile -t matches < <(find "$dir" -name AndroidManifest.xml -type f)
            fi
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::expected one AndroidManifest.xml under ${dir}, found ${#matches[@]}; set merged-manifest-path"
              [ "${#matches[@]}" -eq 0 ] || printf '%s\n' "${matches[@]}"
              exit 1
            fi
            MANIFEST=${matches[0]}
          elif [ ! -f "$MANIFEST" ]; then
            echo "::error::merged manifest not found at ${MANIFEST}"
            exit 1
          fi
          echo "checking ${MANIFEST}"
          rc=0
          grep -E "$FORBIDDEN" "$MANIFEST" || rc=$?
          case "$rc" in
            0) echo "::error::policy-sensitive permission leaked into the merged manifest"; exit 1 ;;
            1) echo "merged manifest clean" ;;
            *) echo "::error::grep failed (exit ${rc}) on ${MANIFEST}; check forbidden-manifest-permissions"; exit 1 ;;
          esac

      - name: Upload AAB artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release-aab
          path: ${{ inputs.app-directory }}/${{ inputs.aab-path }}
          retention-days: 14

      # A signed APK for sideloaded devices (a kiosk tablet before an EMM or
      # managed Play is set up).
      - name: Upload APK artifact
        if: ${{ inputs.apk-path != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release-apk
          path: ${{ inputs.app-directory }}/${{ inputs.apk-path }}
          retention-days: 30
          if-no-files-found: error

      # Keyless: federate GitHub's OIDC token to impersonate the Play publisher SA.
      - name: Authenticate to Google Cloud (WIF)
        if: ${{ inputs.publish }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ inputs.gcp-project }}
          workload_identity_provider: ${{ inputs.wif-provider }}
          service_account: ${{ inputs.wif-service-account }}

      - name: Publish AAB to Google Play
        if: ${{ inputs.publish }}
        uses: $/.github/actions/play-publish
        with:
          mode: upload
          package: ${{ inputs.package-name }}
          aab: ${{ inputs.app-directory }}/${{ inputs.aab-path }}
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
