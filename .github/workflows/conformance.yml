# =============================================================================
# Org conformance — the enforcement half of the paved road.
#
# Intended to run as an ORG-RULESET REQUIRED WORKFLOW on every PR in every app
# repo (Enterprise feature): standards stop being prose the moment this is a
# required check. Three mechanical gates, none repo-specific:
#
#   1. actionlint  — workflow schema/expression/shellcheck validation
#   2. zizmor      — action pinning + workflow security (policy from the
#                    repo's .github/zizmor.yml when present)
#   3. ci-gates    — SARIF uploads / Trivy exit-code gates / cosign steps must
#                    not be continue-on-error'd (standards/ci-cd.md)
#
# Rollout: the ruleset starts in EVALUATE mode — results are recorded on the
# rule insights page without blocking, so repos with a zizmor/actionlint
# backlog surface it before enforcement flips to active.
# =============================================================================

name: Org conformance

on:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    name: Workflow conformance
    # Skip in this repo's own PRs: deploy-workflows carries an acknowledged
    # zizmor backlog (template-injection refactor in build-push-*) tracked by
    # its own pr-checks zizmor job; the ruleset targets APP repos.
    if: github.repository != 'Corey-Alan-Consulting/deploy-workflows'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: zizmor
        run: |
          set -euo pipefail
          pipx install 'zizmor==1.29.0'
          # Offline audits only — deterministic, no API budget; the repo's own
          # .github/zizmor.yml policy applies automatically when present.
          # Gate at low+: informational findings (e.g. use-trusted-publishing
          # advice) print but must not fail an org-wide required check.
          zizmor --no-progress --min-severity=low .github/workflows

      - name: Non-negotiable CI gates are not softened
        run: |
          set -euo pipefail
          status=0
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$file" ] || continue
            awk -v file="$file" '
              function flush() {
                if (prot && soft) {
                  printf "%s:%d: %s is a non-negotiable gate and must not be continue-on-error\n", file, line, label
                  bad++
                }
                prot = 0; soft = 0; label = ""; line = 0
              }
              /^[[:space:]]*-[[:space:]]/ { flush(); line = NR }
              /upload-sarif/              { prot = 1; label = "CodeQL SARIF upload" }
              /exit-code:[[:space:]]*.1./ { prot = 1; label = "Trivy severity gate" }
              /cosign/                    { prot = 1; label = "image signing" }
              /continue-on-error:[[:space:]]*true/ { soft = 1 }
              END { flush(); exit (bad > 0) }
            ' "$file" || status=1
          done
          if [ "$status" -ne 0 ]; then
            echo ""
            echo "Fix by removing the continue-on-error, not by narrowing the gate."
            echo "See framework standards/ci-cd.md, 'Security gates — non-negotiable'."
            exit 1
          fi
          echo "CI gates intact."

      # One Node version per app: tests, build, and the shipped image.
      #
      # app-pr-checks defaults to Node 22 and build-push-nextjs to Node 20 —
      # not a decision, just age (the build workflow is from 2026-03 when 20
      # was LTS, the PR gate from 2026-09 when 22 was). A repo that pins
      # neither therefore tests on one Node and builds on another, and the
      # image it ships is a third. app-template did exactly that and the split
      # cost ten weeks of red releases: a test calling `fs.globSync` (Node 22+)
      # passed PR checks on 22 and failed the release on 20 as
      # `TypeError: globSync is not a function` — so the assertion was dead on
      # the build Node AND it took the whole workflow down.
      #
      # This requires an EXPLICIT pin in both callers rather than comparing
      # against the defaults, because a check that encodes the defaults rots
      # the moment one of them moves. Three repos were already pinning by hand
      # (coreyalan.com, jlshaw.link, showcase), which is the signal this was
      # known and unenforced.
      - name: One Node version per app
        run: |
          set -euo pipefail

          wf_calling() { grep -rlE "workflows/$1\.yml@" .github/workflows 2>/dev/null | head -1; }
          pinned_in() { [ -n "$1" ] && grep -hoE "$2: *'?\"?[0-9]+" "$1" 2>/dev/null | head -1 | grep -oE '[0-9]+'; }

          pr_wf="$(wf_calling app-pr-checks || true)"
          dep_wf="$(wf_calling build-push-nextjs || true)"

          if [ -z "$pr_wf" ] && [ -z "$dep_wf" ]; then
            echo "Neither app-pr-checks nor build-push-nextjs is called here — nothing to align."
            exit 0
          fi

          test_node="$(pinned_in "$pr_wf" 'node-version' || true)"
          build_node="$(pinned_in "$dep_wf" 'node_version' || true)"

          # The shipped image: deploy.yml's `dockerfile:` input, else the
          # build-push-nextjs default of Dockerfile.prebuilt.
          # `|| true` on both: a repo that passes no `dockerfile:` input (several
          # rely on the default) makes grep exit 1, and pipefail + set -e would
          # kill this step with no output at all — failing the repo for a reason
          # nobody can read.
          df="$(grep -hoE '^\s+dockerfile: *\S+' "$dep_wf" 2>/dev/null | head -1 | sed 's/.*dockerfile: *//' || true)"
          [ -n "$df" ] || df="Dockerfile.prebuilt"
          image_node=""
          if [ -f "$df" ]; then
            image_node="$(awk 'tolower($1)=="from"{l=$2} END{print l}' "$df" | sed -nE 's/^node:([0-9]+).*/\1/p' || true)"
          fi

          echo "  test  (${pr_wf:-none}): ${test_node:-UNPINNED}"
          echo "  build (${dep_wf:-none}): ${build_node:-UNPINNED}"
          echo "  image ($df): ${image_node:-n/a}"

          status=0
          if [ -n "$pr_wf" ] && [ -z "$test_node" ]; then
            echo "::error file=$pr_wf::node-version is not pinned, so this repo tests on app-pr-checks' default. Pin it to the Node its image ships."
            status=1
          fi
          if [ -n "$dep_wf" ] && [ -z "$build_node" ]; then
            echo "::error file=$dep_wf::node_version is not pinned, so this repo builds on build-push-nextjs' default. Pin it to the Node its image ships."
            status=1
          fi
          for pair in "test:$test_node" "build:$build_node"; do
            label="${pair%%:*}"; val="${pair#*:}"
            if [ -n "$val" ] && [ -n "$image_node" ] && [ "$val" != "$image_node" ]; then
              echo "::error::$label Node is $val but $df ships node:$image_node. The prebuilt flow copies build output into that image, so these must match."
              status=1
            fi
          done

          if [ "$status" -ne 0 ]; then
            echo ""
            echo "Pin one Node major in pr-checks.yml, deploy.yml and the Dockerfile."
            echo "See framework standards/docker.md and standards/ci-cd.md."
            exit 1
          fi
          echo "Node version is consistent across tests, build and image."
