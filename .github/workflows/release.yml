name: Release

# Reusable Changesets release + npm publish (OIDC) workflow.
#
# Callers (a package repo's .github/workflows/release.yml) trigger this on push
# to main. It does ONE of two things per run:
#   1. Pending .changeset/*.md exist -> open/update a "chore: release packages"
#      PR that bumps versions, regenerates CHANGELOGs, and consumes changesets.
#   2. That PR merged (no pending changesets) -> `changeset tag` writes versions
#      + git tags, then each newly-tagged package is `npm publish`ed over OIDC.
#
# Why `changeset tag` + explicit `npm publish` (not `changeset publish`)?
#   npm Trusted Publishing OIDC is documented for the npm CLI only; pnpm's OIDC
#   support is undocumented and broke across the pnpm 10->11 transition. We
#   version with Changesets and publish on the supported npm CLI path.
#
# Caller requirements:
#   - pnpm workspace with a `version-packages` script. Use the retry wrapper
#     (`node scripts/changeset-version-retry.mjs && pnpm install --lockfile-only`)
#     rather than a bare `changeset version`: @changesets/changelog-github makes a
#     GitHub GraphQL call per changeset that intermittently fails with
#     ERR_STREAM_PREMATURE_CLOSE, and the wrapper retries it.
#   - .changeset/config.json present.
#   - Each publishable package registers an npm Trusted Publisher (see README:
#     the OIDC `workflow` claim is the CALLER's release.yml, so keep that
#     filename and point the publisher at the package repo + release.yml).
#   - GITOPS_APP_ID / GITOPS_APP_PRIVATE_KEY available to the caller repo.

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version for the publish job. 22+ required for npm OIDC.
        type: string
        default: '22'
      app-release-package:
        description: >-
          Optional workspace package name (e.g. a private deployable app). When
          set and that package is in the published set, cut a GitHub Release
          `<name>@<version>` from its CHANGELOG so `release: published`
          downstream workflows fire. Empty = no app release.
        type: string
        default: ''
    secrets:
      GITOPS_APP_ID:
        description: GitHub App id used to push version commits/tags past branch protection.
        required: true
      GITOPS_APP_PRIVATE_KEY:
        description: GitHub App private key paired with GITOPS_APP_ID.
        required: true
      NPM_TOKEN:
        description: >-
          Optional npm read token, used only to install restricted
          @scope/* dependencies during `pnpm install`. Publishing stays on
          OIDC Trusted Publishing — this token never publishes. Omit for repos
          with no private registry dependencies.
        required: false

# Serialize release runs: two quick pushes to main would otherwise race on
# tag pushes and GitHub Release creation. Never cancel an in-flight release —
# it may have already npm-published and only have the release step left to do.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for npm Trusted Publishing OIDC: the npm CLI mints + exchanges a
  # short-lived token at publish time. No NPM_TOKEN secret needed.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          # Least-privilege: scope the installation token instead of inheriting
          # the App's blanket permissions. contents:write pushes the version
          # commit + tags; pull-requests:write manages the release PR.
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The App token persists so the changesets action can push the version
          # commit + tags. This intentionally keeps credentials in the checkout.
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Node 22 ships npm 10.x; npm 11.5.1+ gates Trusted Publishing OIDC.
      - name: Upgrade npm to OIDC-capable version
        run: npm install -g npm@latest

      - name: Install dependencies
        # NODE_AUTH_TOKEN is scoped to this step only, so it authenticates the
        # install of restricted deps without leaking into the OIDC publish step
        # (setup-node wrote an .npmrc that reads this var; empty = no auth).
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Create Release PR or tag versions
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # changesets/action v2 renamed these inputs and hard-errors on the
          # old names — the dependabot v2 bump landed without this migration.
          version-script: pnpm version-packages
          # `changeset tag` updates versions, consumes changesets, regenerates
          # CHANGELOGs, and creates git tags but does NOT publish. action v2 no
          # longer scrapes stdout for "New tag" lines — it injects
          # CHANGESETS_OUTPUT into this script and reads the NDJSON that
          # Changesets v3 writes there, exposing it as the `published-packages`
          # output (v1 spelled it `publishedPackages`; v2 renamed every output
          # to kebab-case while leaving `published` alone, which is why a stale
          # name fails silently rather than failing the gate).
          publish-script: pnpm exec changeset tag
          commit-message: 'chore: release packages'
          pr-title: 'chore: release packages'
          # Pinned rather than inherited, because the defaults bite.
          #
          # v2 defaults `create-github-releases` to true, and its own docs say
          # of `push-git-tags`: "If `create-github-releases` is set to `true`,
          # this option will also always be `true`." So the action writes each
          # tag ref TWICE — once creating the Release (the Releases API creates
          # the tag) and once pushing tags. Every write is a `push` event, so an
          # app whose deploy triggers on `push: tags` gets two identical deploy
          # runs racing on one version. Concurrency is not a reliable backstop:
          # the two writes land seconds apart and the runs can slip past group
          # evaluation, which is how gatherbee@0.3.0 built twice.
          #
          # Where this workflow cuts the app's Release itself (below, with notes
          # lifted from the package's CHANGELOG) the action must not also do it
          # — that step was silently dead, always finding the Release already
          # there. Library-only repos have no such step, so they keep the
          # action's release creation and its harmless double tag write; nothing
          # in those repos triggers on a tag. Generalising the step below to
          # every published package would let this be an unconditional false.
          create-github-releases: ${{ inputs.app-release-package == '' }}
          # Explicit because it is no longer implied once the above is false,
          # and because a release that pushes no tag is a release nothing can
          # deploy.
          push-git-tags: true
          # v2 pushes via the GitHub API by default (signed commits/tags; the
          # old commitMode input was removed) and takes the token as an INPUT —
          # a GITHUB_TOKEN env var that differs from it is a hard error.
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Build library packages (topological)
        if: steps.changesets.outputs.published == 'true'
        # The publish loop below iterates in workspace-discovery (alphabetical)
        # order, NOT dependency order — a package whose workspace deps sort
        # after it (e.g. audit -> platform-kernel) needs those deps' dist/
        # built BEFORE its own build runs. `pnpm -r run` is topological, so
        # one recursive build here fixes ordering for every package. Scoped to
        # packages/** so an app repo's root `next build` never runs; packages
        # without a build/smoke script are skipped by recursive run semantics.
        run: |
          set -euo pipefail
          if [ -d packages ]; then
            # --if-present: pnpm recursive run HARD-FAILS when no selected
            # package has the script (it only "skips" when at least one does) —
            # a repo whose packages define build but no smoke died here.
            pnpm --filter './packages/**' run --if-present build
            pnpm --filter './packages/**' run --if-present smoke
          fi

      - name: Publish changed packages to npm (OIDC)
        if: steps.changesets.outputs.published == 'true'
        env:
          # Passed via env (not inlined) so the JSON can't break the shell.
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          set -euo pipefail
          # The action reported something published, so the package list must be
          # non-empty. An empty list means the output contract drifted -- v2 renamed
          # every output to kebab-case while leaving `published` alone, so a stale
          # name leaves the gate green and the list blank. `jq -r '.[].name'` over
          # empty input emits nothing and exits 0, so without this check the step
          # reports success having published nothing at all. Fail loudly instead.
          if [ -z "${PUBLISHED_PACKAGES:-}" ] \
            || [ "$(printf '%s' "$PUBLISHED_PACKAGES" | jq -r 'length' 2>/dev/null || echo 0)" = "0" ]; then
            echo "::error title=Empty published-packages::changesets reported published=true but the package list is empty. Refusing to report success without publishing. Verify this workflow reads the output name the pinned changesets/action actually emits."
            exit 1
          fi
          # Map each published package name -> its workspace dir, then publish.
          pnpm list -r --depth -1 --json > .pkg-paths.json
          printf '%s' "$PUBLISHED_PACKAGES" | jq -r '.[].name' | while read -r name; do
            dir="$(jq -r --arg n "$name" '.[] | select(.name == $n) | .path' .pkg-paths.json)"
            if [ -z "$dir" ] || [ "$dir" = "null" ]; then
              echo "::warning::No workspace dir for $name; skipping"
              continue
            fi
            # Skip private packages: they get versioned/tagged (e.g. a deployable
            # app's `app@<v>` tag) but must never be npm-published.
            if [ "$(jq -r '.private // false' "$dir/package.json")" = "true" ]; then
              echo "Skipping private package $name"
              continue
            fi
            echo "Publishing $name from $dir"
            # pnpm pack rewrites `workspace:^` dependency ranges to the real
            # versions in the tarball manifest — a bare `npm publish` ships
            # them verbatim, producing packages consumers cannot install. The
            # publish itself stays on the npm CLI (the documented OIDC Trusted
            # Publishing path). Tarball publishes do not run prepublishOnly:
            # the explicit build+smoke step above replaces it in CI, while
            # prepublishOnly still guards manual publishes.
            ( cd "$dir" && pnpm pack --out "$RUNNER_TEMP/publish-package.tgz" \
              && npm publish "$RUNNER_TEMP/publish-package.tgz" --access restricted )
          done

      # Optional: cut a GitHub Release for a deployable app package so the
      # `release: published` event fires downstream. The app's git tag itself
      # is created by `changeset tag` above;
      # this only adds the GitHub Release object. Uses the App token so the
      # published-release event is allowed to trigger other workflows.
      - name: Create GitHub Release for app version
        if: ${{ inputs.app-release-package != '' && steps.changesets.outputs.published == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
          APP_PACKAGE: ${{ inputs.app-release-package }}
        run: |
          set -euo pipefail
          # The action reported something published, so the package list must be
          # non-empty. An empty list means the output contract drifted -- v2 renamed
          # every output to kebab-case while leaving `published` alone, so a stale
          # name leaves the gate green and the list blank. `jq -r '.[].name'` over
          # empty input emits nothing and exits 0, so without this check the step
          # reports success having published nothing at all. Fail loudly instead.
          if [ -z "${PUBLISHED_PACKAGES:-}" ] \
            || [ "$(printf '%s' "$PUBLISHED_PACKAGES" | jq -r 'length' 2>/dev/null || echo 0)" = "0" ]; then
            echo "::error title=Empty published-packages::changesets reported published=true but the package list is empty. The app release cannot be resolved from an empty list. This is a drifted output name, not 'nothing to release' -- the legitimate no-op case below needs a POPULATED list that simply lacks this app."
            exit 1
          fi
          version="$(printf '%s' "$PUBLISHED_PACKAGES" \
            | jq -r --arg n "$APP_PACKAGE" '.[] | select(.name == $n) | .version')"
          if [ -z "$version" ]; then
            echo "App package $APP_PACKAGE not in published set; no app release to create."
            exit 0
          fi

          tag="${APP_PACKAGE}@${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; skipping."
            exit 0
          fi

          # Resolve the app package's own CHANGELOG (changesets writes one per
          # package dir, not just the repo root). .pkg-paths.json was written by
          # the publish step above, which runs under the same `published` gate.
          dir="$(jq -r --arg n "$APP_PACKAGE" '.[] | select(.name == $n) | .path' .pkg-paths.json)"
          [ -n "$dir" ] && [ "$dir" != "null" ] || dir="."
          changelog="${dir}/CHANGELOG.md"

          # Extract this version's CHANGELOG section (## <version> .. next ## ).
          # Best-effort: never hard-fail here — npm publish already ran, and a
          # missing/empty changelog must not leave a published version with no
          # GitHub Release. Fall back to a minimal note instead.
          notes=""
          if [ -f "$changelog" ]; then
            notes="$(awk -v hdr="## ${version}" '
              $0 == hdr { capture = 1; next }
              /^## / && capture { exit }
              capture { print }
            ' "$changelog")"
          else
            echo "::warning::No CHANGELOG at ${changelog}; using fallback release notes."
          fi
          [ -n "$notes" ] || notes="Release ${tag}"

          notes_file="$(mktemp)"
          printf '%s\n' "$notes" > "$notes_file"
          gh release create "$tag" --title "$tag" --notes-file "$notes_file"

      # Post-condition for the whole workflow. Runs unconditionally, so it holds
      # in both modes: after a publish it confirms the publish actually landed,
      # and on a version-PR run it confirms nothing has silently fallen out of
      # the registry.
      - name: Verify every package version reached the registry
        env:
          # Read-only token, same as the install step. Publishing stays on OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          # Post-condition for the whole workflow, not just the publish step: every
          # non-private workspace package's CURRENT version must exist on the registry.
          #
          # This is the check that was missing when crm-csv 0.1.2 was versioned, tagged
          # and committed to main while the publish step silently skipped -- the job went
          # green, the tag never reached the remote, and the gap was only noticed weeks
          # later when a consumer still resolved the vulnerable 0.1.1.
          #
          # Deliberately scoped to CURRENT versions rather than every historical tag.
          # Comparing all tags would permanently flag six pre-existing holes from the
          # June scaffolding (crm-core 0.1.0, crm-prisma 0.1.0, lms-content 0.1.0,
          # lms-courses 0.2.0, lms-quiz 0.1.0, lms-roster 0.1.0) that are superseded by
          # later published releases and referenced by nobody -- noise that would need an
          # allowlist and would train people to ignore this check. Current-version parity
          # is the invariant that actually matters and it has no known false positives.
          #
          # Runs unconditionally, so it holds in both workflow modes: after a publish it
          # confirms the publish landed, and on a version-PR run it confirms nothing has
          # silently fallen out of the registry.
          pnpm list -r --depth -1 --json > .pkg-parity.json

          missing=""
          unreadable=""
          checked=0

          while IFS=$'\t' read -r name version dir; do
            [ -n "$name" ] || continue
            [ -f "$dir/package.json" ] || continue
            # Private packages are versioned and tagged (a deployable app gets its
            # `app@<v>` tag) but never published, so they have nothing to verify.
            if [ "$(jq -r '.private // false' "$dir/package.json")" = "true" ]; then
              continue
            fi
            checked=$((checked + 1))
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "  ok        ${name}@${version}"
            elif npm view "$name" version >/dev/null 2>&1; then
              # The package is readable but this version is not there: a real hole.
              echo "  MISSING   ${name}@${version}"
              missing="${missing} ${name}@${version}"
            else
              # The package itself is unreadable. These are `access: restricted`, and npm
              # answers 404 for unauthorized exactly as it does for absent, so this is an
              # auth problem and must not be reported as a missing release.
              echo "  UNREADABLE ${name} (cannot distinguish absent from unauthorized)"
              unreadable="${unreadable} ${name}"
            fi
          done < <(jq -r '.[] | [.name, .version, .path] | @tsv' .pkg-parity.json)

          rm -f .pkg-parity.json

          if [ -n "$unreadable" ]; then
            # WARN, never fail. Inability to verify is not evidence of a problem,
            # and a verification step must not be able to break a working
            # release. `platform` omits the optional NPM_TOKEN secret, so its
            # first run of this check reported all 11 packages unreadable and
            # failed a release that had nothing to publish and was otherwise
            # fine. npm answers 404 identically for unauthorized and absent, so
            # the honest outcome here is "could not verify", not "broken".
            echo "::warning title=Registry parity unverified::Could not read these packages from npm:${unreadable}. npm returns 404 for both 'unpublished' and 'unauthorized', so this is not evidence of a missing release -- it means parity could not be checked. Pass the optional NPM_TOKEN secret to this workflow to enable it."
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Version not on the registry::These versions exist in the repo but not on npm:${missing}. The release pipeline reported success without publishing them. Re-run the release; if the git tag already exists, delete the remote tag first so changeset tag re-creates it, because publish detection is driven by tag creation."
            exit 1
          fi
          if [ -n "$unreadable" ]; then
            echo "Registry parity checked for ${checked} package(s); some could not be read (see warning above)."
          else
            echo "Registry parity verified for ${checked} published package(s)."
          fi
