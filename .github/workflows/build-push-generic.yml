name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      app_name:
        description: "Application name"
        required: true
        type: string
      gcp_project_id:
        description: "GCP project ID where Artifact Registry lives"
        required: true
        type: string
      gcp_project_number:
        description: "GCP project number (for WIF provider path)"
        required: true
        type: string
      ar_repository:
        description: "Artifact Registry repo/image path (e.g. 'myapp/myimage')"
        required: true
        type: string
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      build_context:
        description: "Docker build context path"
        required: false
        type: string
        default: "."
      build_args:
        description: "Docker build arguments (newline-separated KEY=VALUE)"
        required: false
        type: string
        default: ""
      enable_image_cleanup:
        description: "Clean old images from Artifact Registry"
        required: false
        type: boolean
        default: true
      images_to_keep:
        description: "Number of recent images to keep"
        required: false
        type: number
        default: 10
      registry:
        description: "Artifact Registry hostname"
        required: false
        type: string
        default: "us-central1-docker.pkg.dev"
      wif_provider_override:
        description: "Full WIF provider path (overrides convention)"
        required: false
        type: string
        default: ""
      wif_sa_override:
        description: "GCP service account email (overrides convention)"
        required: false
        type: string
        default: ""
    secrets:
      npm_auth_token:
        description: |
          Optional npm registry auth token for installing private scoped
          packages (e.g. @corey-alan-consulting/*). Forwarded to the Docker
          build as a BuildKit secret with id=npm_token. Consume it from
          within the Dockerfile via:
            RUN --mount=type=secret,id=npm_token ...
          The value is never written to image layers.
        required: false

concurrency:
  group: deploy-${{ inputs.app_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WIF_PROVIDER: ${{ inputs.wif_provider_override != '' && inputs.wif_provider_override || format('projects/{0}/locations/global/workloadIdentityPools/github-pool/providers/github-provider', inputs.gcp_project_number) }}
  WIF_SA: ${{ inputs.wif_sa_override != '' && inputs.wif_sa_override || format('github-actions@{0}.iam.gserviceaccount.com', inputs.gcp_project_id) }}
  IMAGE: ${{ inputs.registry }}/${{ inputs.gcp_project_id }}/${{ inputs.ar_repository }}

jobs:
  docker:
    name: Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ env.IMAGE }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ inputs.registry }}

      - uses: docker/setup-buildx-action@v3

      - name: Determine tags
        id: tags
        env:
          SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAGS="${IMAGE}:${SHA}"
          TAGS="${TAGS},${IMAGE}:latest"
          # Normalize Changesets-style "<pkg>@<semver>" tags to "v<semver>"
          # since '@' isn't legal in OCI image tags. Pass other shapes
          # through unchanged. See build-push-nextjs.yml for full rationale.
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ "$REF_NAME" == *"@"* ]]; then
              VERSION="v${REF_NAME##*@}"
            else
              VERSION="$REF_NAME"
            fi
            TAGS="${TAGS},${IMAGE}:${VERSION}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ inputs.build_args }}
          secrets: |
            npm_token=${{ secrets.npm_auth_token }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign image
        uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: docker
    if: inputs.enable_image_cleanup
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Delete old images
        run: |
          IMAGE_PATH="${{ inputs.registry }}/${{ inputs.gcp_project_id }}/${{ inputs.ar_repository }}"
          KEEP=${{ inputs.images_to_keep }}

          DIGESTS=$(gcloud artifacts docker images list "${IMAGE_PATH}" \
            --sort-by="~UPDATE_TIME" \
            --format="value(version)" \
            --include-tags 2>/dev/null || true)

          [ -z "$DIGESTS" ] && exit 0

          COUNT=0
          while IFS= read -r digest; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt $KEEP ]; then
              echo "Deleting: ${digest}"
              gcloud artifacts docker images delete "${IMAGE_PATH}@${digest}" \
                --quiet --delete-tags 2>/dev/null || true
            fi
          done <<< "$DIGESTS"
