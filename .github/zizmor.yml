# zizmor configuration — https://docs.zizmor.sh/configuration/
rules:
  unpinned-uses:
    config:
      policies:
        # First-party org actions (e.g. this repo's own
        # .github/actions/setup-turbo-cache, referenced by the reusable
        # workflows at @v1) cannot hash-pin to themselves, so a ref pin is
        # accepted. Third-party actions must still be hash-pinned.
        "Corey-Alan-Consulting/*": ref-pin
        "*": hash-pin
  artipacked:
    ignore:
      # release.yml checks out with the GitHub App token so the Changesets
      # action can push the version commit + tags. The token is least-privilege
      # (contents + pull-requests only), so persisting it is acceptable here.
      - release.yml
  adhoc-packages:
    ignore:
      # npm 11.5.1+ is required for Trusted Publishing OIDC; setup-node ships
      # npm 10 with Node 22, so the global upgrade is unavoidable.
      - release.yml
  use-trusted-publishing:
    ignore:
      # setup-node's always-auth + NODE_AUTH_TOKEN here authenticates to INSTALL
      # private @corey-alan-consulting/* packages during pnpm install. Trusted
      # Publishing is for publishing packages, not installing them, so it does
      # not apply to this read-auth. (The desktop workflows don't trip this —
      # their setup-node lives in the desktop-build-setup composite action.)
      - android-release.yml
      - extension-release.yml
